<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>りっちゃんすっくんのどんぐり集めゲーム</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
<style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap');
        :root {
            overscroll-behavior: none;
            --wood: #8b5a2b;
            --leaf: #4f9b47;
            --leaf-dark: #2f6f35;
            --cream: #fff6d9;
            --gold: #f6c945;
            --acorn: #9a5b26;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%;
            height: 100vh; height: 100dvh;
            overflow: hidden;
            font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Yu Gothic', 'YuGothic', 'Meiryo', system-ui, sans-serif;
            background: radial-gradient(circle at 50% 0%, #fff0b8 0%, #d9f0a7 35%, #7fc36a 100%);
            color: #4b3219;
        }

        .name-guide {
            margin: 12px 0 4px 0;
            font-size: clamp(1.02em, 4.5vw, 1.15em);
            font-weight: 800;
            color: #6b431e;
            letter-spacing: .02em;
        }
        h1, h2, button, input, .info-pill, .character-card, .modal-content {
            font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Yu Gothic', 'YuGothic', 'Meiryo', system-ui, sans-serif;
            letter-spacing: .02em;
        }
        h1, h2 {
            font-weight: 900;
            text-shadow: 0 3px 0 rgba(255,255,255,.72), 0 6px 14px rgba(93,58,23,.16);
        }
        button {
            font-weight: 900;
            border-radius: 999px !important;
        }
        input {
            border-radius: 999px !important;
            font-weight: 700;
        }

        .app-container {
            display: flex; flex-direction: column; width: 100%; height: 100%;
            background:
                radial-gradient(circle at 12% 12%, rgba(255,255,255,.45) 0 4px, transparent 5px),
                radial-gradient(circle at 84% 18%, rgba(255,255,255,.35) 0 3px, transparent 4px);
        }
        .info-bar {
            display: flex; justify-content: center; align-items: center; gap: 0;
            padding: calc(7px + env(safe-area-inset-top, 0px)) 8px 7px;
            background: linear-gradient(180deg, #fff7d7 0%, #ffe5a0 100%);
            border-bottom: 3px solid #b8792f;
            box-shadow: 0 3px 10px rgba(80, 45, 10, .22);
            flex-shrink: 0;
            flex-wrap: nowrap;
        }
        .hud-pill {
            min-width: 0;
            max-width: calc(100vw - 24px);
            display: inline-flex; justify-content: center; align-items: center;
            padding: 7px 14px;
            border-radius: 999px;
            color: #4a2b13;
            font-size: clamp(.94rem, 3.6vw, 1.08rem);
            font-weight: 900;
            letter-spacing: .02em;
            background: rgba(255, 255, 255, .7);
            border: 2px solid rgba(139, 90, 43, .35);
            box-shadow: inset 0 -2px 0 rgba(139, 90, 43, .12);
            white-space: nowrap;
        }
        #score-display { min-width: min(260px, calc(100vw - 28px)); }
        #score-display::before { content: "🌰"; margin-right: 4px; }

        #canvas-holder {
            flex-grow: 1;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; line-height: 0;
            background: linear-gradient(180deg, #9edb7e 0%, #66ad5f 100%);
            position: relative;
        }
        #canvas-holder::before {
            content: "";
            position: absolute; inset: 0;
            background:
                radial-gradient(circle at 18% 18%, rgba(255,255,255,.30), transparent 18%),
                radial-gradient(circle at 82% 12%, rgba(255,245,160,.32), transparent 20%),
                linear-gradient(180deg, rgba(255,255,255,.14), rgba(0,0,0,.08));
            pointer-events: none;
        }
        #canvas-holder canvas {
            max-width: 100%; max-height: 100%; object-fit: contain;
            border-left: 3px solid #5a351b;
            border-right: 3px solid #5a351b;
            box-shadow: 0 0 0 4px rgba(255, 244, 196, .45), 0 10px 28px rgba(40, 70, 20, .35);
            display: none;
            z-index: 1;
        }
        #combo-display {
            position: absolute;
            top: 18px; right: 18px;
            z-index: 3;
            font-size: clamp(1.25rem, 5vw, 1.8rem);
            font-weight: 1000;
            color: #ffffff;
            text-shadow: 0 2px 0 #6b3d15, 0 4px 10px rgba(0,0,0,.45);
            display: none;
            transition: transform .1s ease-out;
            line-height: 1.08;
            text-align: right;
            padding: 8px 12px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(105, 65, 24, .58), rgba(46, 111, 53, .45));
            border: 2px solid rgba(255, 245, 190, .75);
            backdrop-filter: blur(2px);
        }
        #combo-display.active { transform: scale(1.18) rotate(-2deg); }
        .fever-text { color: #ffe45e; font-weight: 1000; }
        .fever-timer { font-size: .72em; color: #ffffff; font-weight: 800; }

        .game-state-content {
            display: none;
            flex-direction: column; justify-content: center; align-items: center;
            color: #4a2b13;
            padding: 18px;
            text-align: center;
            z-index: 2;
            width: min(94%, 460px);
            line-height: 1.2;
        }
        .title-card {
            width: 100%;
            padding: 22px 18px;
            border-radius: 28px;
            background: linear-gradient(180deg, rgba(255, 249, 215, .96), rgba(255, 226, 150, .96));
            border: 4px solid #a56b2d;
            box-shadow: 0 10px 0 #6e431d, 0 18px 30px rgba(44, 69, 20, .35);
            position: relative;
            overflow: hidden;
        }
        .title-card::before, .title-card::after {
            content: "";
            position: absolute;
            width: 115px; height: 115px;
            border-radius: 50%;
            background: rgba(246, 201, 69, .22);
            pointer-events: none;
        }
        .title-card::before { left: -30px; top: -35px; }
        .title-card::after { right: -42px; bottom: -50px; }
        .character-row {
            display: flex;
            justify-content: center;
            align-items: end;
            gap: 12px;
            min-height: 96px;
            margin-bottom: 4px;
            position: relative;
            z-index: 1;
        }
        .character-row img {
            width: clamp(76px, 25vw, 112px);
            height: auto;
            filter: drop-shadow(0 6px 0 rgba(107, 61, 21, .16));
        }
        .character-row img:nth-child(2) { transform: translateY(-4px); }
        .game-state-content h1 {
            margin: 2px 0 10px;
            font-size: clamp(2rem, 10vw, 3.25rem);
            line-height: 1.02;
            color: #7a4317;
            text-shadow: 0 3px 0 #fff1a8;
            letter-spacing: .02em;
            position: relative;
            z-index: 1;
        }
        .game-state-content h2 {
            margin: 8px 0 10px;
            font-size: clamp(1.8rem, 8vw, 2.35rem);
            color: #7a4317;
            text-shadow: 0 2px 0 #fff1a8;
            position: relative;
            z-index: 1;
        }
        .game-state-content p {
            font-size: clamp(1rem, 4.5vw, 1.35rem);
            line-height: 1.55;
            margin: 0 0 16px 0;
            font-weight: 800;
            position: relative;
            z-index: 1;
        }
        .sub-note {
            display: inline-block;
            margin-top: 4px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .6);
            border: 1px solid rgba(139, 90, 43, .25);
            font-size: .86em;
        }
        .game-state-content button,
        .button-bar button,
        .modal-content button {
            padding: 12px 20px;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 900;
            color: white;
            background: linear-gradient(180deg, #62b85a, #2f8d45);
            box-shadow: 0 5px 0 #206d31, 0 8px 14px rgba(0,0,0,.18);
            transition: transform .08s ease, box-shadow .08s ease, filter .2s ease;
            position: relative;
            z-index: 1;
        }
        .game-state-content button:active,
        .button-bar button:active,
        .modal-content button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #206d31, 0 4px 8px rgba(0,0,0,.16);
        }
        .game-state-content input {
            padding: 12px 14px;
            width: 82%; max-width: 260px;
            margin: 12px 0;
            border: 3px solid #c69043;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 800;
            text-align: center;
            background: #fffdf1;
            color: #4a2b13;
            outline: none;
            position: relative;
            z-index: 1;
        }
        .game-state-content input:focus { border-color: #50a24b; box-shadow: 0 0 0 4px rgba(80,162,75,.18); }
        .game-state-content .button-group {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
            position: relative;
            z-index: 1;
        }
        .game-state-content .button-group button { margin: 0; }
        #submit-score-btn { background: linear-gradient(180deg, #f6c945, #e9942f); box-shadow: 0 5px 0 #b76818, 0 8px 14px rgba(0,0,0,.18); color: #4a2b13; }
        #retry-btn { background: linear-gradient(180deg, #62b85a, #2f8d45); }
        #start-btn { font-size: 1.25rem; padding: 14px 34px; }

        .button-bar {
            display: flex; justify-content: center; align-items: center;
            padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px));
            background: linear-gradient(180deg, #ffe8a8, #ffd375);
            box-shadow: 0 -3px 12px rgba(80,45,10,.18);
            border-top: 3px solid #b8792f;
            flex-shrink: 0; gap: 10px;
        }
        .button-bar button {
            flex-grow: 1;
            max-width: 240px;
            padding: 11px 10px;
            font-size: clamp(.94rem, 3.7vw, 1.04rem);
        }
        #ranking-btn { background: linear-gradient(180deg, #70bdf3, #2d83c6); box-shadow: 0 5px 0 #1c6098, 0 8px 14px rgba(0,0,0,.18); }

        .modal-overlay {
            display: none; position: fixed; z-index: 100; top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(38, 63, 24, .68);
            justify-content: center; align-items: center;
            padding: 15px; box-sizing: border-box;
            backdrop-filter: blur(2px);
        }
        .modal-content {
            background: linear-gradient(180deg, #fffaf0, #ffecc0);
            padding: 24px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 0 #75491f, 0 18px 28px rgba(0,0,0,.28);
            border: 4px solid #a56b2d;
            width: 100%; max-width: 430px; max-height: 90vh;
            display: flex; flex-direction: column;
            color: #4a2b13;
            line-height: 1.25;
        }
        .modal-content h2 {
            margin-top: 0; margin-bottom: 18px; flex-shrink: 0;
            font-size: 1.65rem;
            color: #7a4317;
            text-shadow: 0 2px 0 #fff1a8;
        }
        .close-btn { background: linear-gradient(180deg, #ef775e, #d94b32) !important; box-shadow: 0 5px 0 #a53020, 0 8px 14px rgba(0,0,0,.18) !important; margin-top: 18px; flex-shrink: 0; }
        .legend-item {
            display: flex; align-items: center;
            margin-bottom: 10px;
            font-size: .98rem;
            text-align: left;
            font-weight: 800;
            background: rgba(255,255,255,.52);
            border: 1px solid rgba(139,90,43,.18);
            border-radius: 13px;
            padding: 8px 10px;
        }
        .legend-icon {
            width: 28px; height: 28px; border-radius: 50%;
            margin-right: 10px;
            border: 2px solid rgba(94,55,20,.35);
            flex-shrink: 0;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,.12);
        }
        #ranking-list {
            list-style-type: none; padding: 0; text-align: left;
            flex-grow: 1;
            overflow-y: auto;
            min-height: 0;
            margin: 0;
        }
        #ranking-list li {
            background-color: rgba(255,255,255,.62);
            padding: 10px 14px;
            border-bottom: 1px solid rgba(139,90,43,.18);
            font-size: 1rem;
            font-weight: 850;
            border-radius: 12px;
            margin-bottom: 6px;
        }
        #ranking-list li:nth-child(1) { background: linear-gradient(90deg, #fff2a3, #fffdf1); }
        #ranking-list li:nth-child(2) { background: linear-gradient(90deg, #eeeeee, #fffdf1); }
        #ranking-list li:nth-child(3) { background: linear-gradient(90deg, #ffd5a6, #fffdf1); }

        .ranking-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin: 0 0 12px;
            flex-shrink: 0;
        }
        .ranking-tab {
            padding: 8px 6px !important;
            font-size: .86rem !important;
            background: linear-gradient(180deg, #fff8d9, #f5d487) !important;
            color: #5a3516 !important;
            border: 2px solid rgba(139,90,43,.35) !important;
            box-shadow: 0 3px 0 #b8792f !important;
        }
        .ranking-tab.active {
            background: linear-gradient(180deg, #8ed36f, #4f9b47) !important;
            color: #fffdf0 !important;
            box-shadow: 0 3px 0 #2f6f35 !important;
        }
        .category-guide {
            margin: 8px 0 6px;
            font-size: .95rem;
            font-weight: 900;
            color: #6b431e;
        }
        .category-select {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 8px 0 4px;
        }
        .category-choice {
            padding: 9px 8px !important;
            font-size: .95rem !important;
            background: linear-gradient(180deg, #fff8d9, #f0cf7c) !important;
            color: #5a3516 !important;
            border: 2px solid rgba(139,90,43,.35) !important;
            box-shadow: 0 4px 0 #b8792f, 0 7px 12px rgba(0,0,0,.13) !important;
        }
        .category-choice.selected {
            background: linear-gradient(180deg, #8ed36f, #4f9b47) !important;
            color: #fffdf0 !important;
            box-shadow: 0 4px 0 #2f6f35, 0 7px 12px rgba(0,0,0,.13) !important;
        }
        button:disabled { filter: grayscale(.4); opacity: .7; cursor: not-allowed; }

        .character-select {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 12px 0 16px;
            position: relative;
            z-index: 1;
        }
        .game-state-content .character-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 3px;
            min-width: 0;
            padding: 9px 7px 10px;
            border-radius: 18px;
            border: 3px solid rgba(151, 92, 38, .42);
            background: linear-gradient(180deg, rgba(255,255,255,.86), rgba(255, 238, 176, .88));
            color: #4a2b13;
            box-shadow: inset 0 -4px 0 rgba(139, 90, 43, .15), 0 4px 10px rgba(80, 45, 10, .16);
            text-align: center;
            line-height: 1.18;
        }
        .game-state-content .character-card.selected {
            transform: translateY(-3px);
            border-color: #2f8d45;
            background: linear-gradient(180deg, #fffdf1, #dff5a9);
            box-shadow: 0 0 0 4px rgba(255, 232, 92, .55), inset 0 -4px 0 rgba(47, 141, 69, .18), 0 8px 14px rgba(80, 45, 10, .18);
        }
        .game-state-content .character-card:active {
            transform: translateY(-1px);
            box-shadow: inset 0 -2px 0 rgba(139, 90, 43, .15), 0 3px 8px rgba(80, 45, 10, .15);
        }
        .character-card img {
            width: clamp(58px, 21vw, 82px);
            height: auto;
            filter: drop-shadow(0 5px 0 rgba(107, 61, 21, .14));
        }
        .character-card strong {
            font-size: clamp(1rem, 4vw, 1.16rem);
            color: #7a4317;
        }
        .character-card span:not(.choice-badge) {
            font-size: clamp(.78rem, 3.2vw, .9rem);
            font-weight: 900;
        }
        .character-card small {
            font-size: clamp(.68rem, 2.8vw, .78rem);
            font-weight: 800;
            color: #6a4a25;
        }
        .choice-badge {
            align-self: flex-start;
            padding: 3px 8px;
            border-radius: 999px;
            background: #fff1a8;
            border: 1px solid rgba(139, 90, 43, .28);
            font-size: .72rem;
            font-weight: 1000;
            color: #6a3f17;
        }
        .result-character {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 6px 13px;
            border-radius: 999px;
            background: rgba(255,255,255,.66);
            border: 2px solid rgba(139,90,43,.28);
            font-weight: 1000;
            color: #6a3f17;
            position: relative;
            z-index: 1;
        }
        .result-character img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: drop-shadow(0 4px 0 rgba(107, 61, 21, .12));
        }
        .legend-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }



        /* 2026-06 UI調整: ロゴ、ゲーム内HUD、ランキングタブ、結果ボタン */
        .game-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin: 0 0 12px !important;
            line-height: .96 !important;
            letter-spacing: .01em !important;
        }
        .game-logo .logo-line {
            display: inline-block;
            white-space: nowrap;
            border-radius: 999px;
            border: 3px solid #7b4619;
            box-shadow: 0 5px 0 #e09332, 0 9px 16px rgba(77, 41, 12, .20), inset 0 2px 0 rgba(255,255,255,.55);
            text-shadow:
                2px 0 0 #fff3ab,
                -2px 0 0 #fff3ab,
                0 2px 0 #fff3ab,
                0 -2px 0 #fff3ab,
                2px 2px 0 #fff3ab,
                -2px 2px 0 #fff3ab,
                0 5px 0 rgba(89, 50, 17, .18);
        }
        .game-logo .logo-line-top {
            padding: .13em .58em .17em;
            font-size: clamp(1.24rem, 5.6vw, 1.85rem);
            color: #e46e35;
            background: linear-gradient(180deg, #fffdf2, #ffe38c);
            transform: rotate(-1.6deg);
        }
        .game-logo .logo-line-main {
            padding: .12em .45em .18em;
            font-size: clamp(1.72rem, 7.6vw, 2.72rem);
            color: #8c4b18;
            background: linear-gradient(180deg, #fff3a8, #f7c14d 72%, #ee963a);
            transform: rotate(1deg);
        }
        .game-logo .logo-line-main::before,
        .game-logo .logo-line-main::after {
            content: "🌰";
            font-size: .58em;
            vertical-align: .08em;
            margin: 0 .16em;
            text-shadow: none;
        }

        .game-state-content .character-card {
            min-height: 176px;
            padding: 11px 8px 14px;
            gap: 5px;
            overflow: visible;
        }
        .character-card img { width: clamp(54px, 19vw, 76px); }
        .character-card small {
            display: block;
            width: 100%;
            margin-top: 3px;
            padding: 5px 7px;
            border-radius: 999px;
            line-height: 1.22;
            background: rgba(255, 255, 255, .72);
            border: 1px solid rgba(139, 90, 43, .20);
        }
        .game-state-content .character-card.selected {
            box-shadow: 0 0 0 3px rgba(255, 232, 92, .55), inset 0 -4px 0 rgba(47, 141, 69, .18), 0 8px 14px rgba(80, 45, 10, .18);
        }

        .result-buttons {
            width: 82%;
            max-width: 280px;
            margin: 10px auto 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 11px;
        }
        .result-buttons button { width: 100%; }
        #submit-score-btn { margin-top: 10px; }
        #retry-btn {
            background: linear-gradient(180deg, #fff8d9, #d9b25d) !important;
            color: #5a3516 !important;
            box-shadow: 0 5px 0 #a9782c, 0 8px 14px rgba(0,0,0,.16) !important;
        }

        .ranking-tabs {
            display: flex;
            gap: 0;
            margin: 0;
            padding: 5px 5px 0;
            border: 3px solid #b8792f;
            border-bottom: 0;
            border-radius: 18px 18px 0 0;
            background: rgba(255, 236, 179, .70);
        }
        .ranking-tab {
            flex: 1 1 0;
            padding: 9px 4px 10px !important;
            font-size: clamp(.76rem, 3.1vw, .9rem) !important;
            border-radius: 13px 13px 0 0 !important;
            border: 0 !important;
            border-bottom: 3px solid transparent !important;
            background: linear-gradient(180deg, #fff8d9, #efd18b) !important;
            box-shadow: inset 0 -3px 0 rgba(139, 90, 43, .14) !important;
        }
        .ranking-tab.active {
            transform: translateY(2px);
            background: linear-gradient(180deg, #8ed36f, #4f9b47) !important;
            color: #fffdf0 !important;
            border-bottom-color: #4f9b47 !important;
            box-shadow: inset 0 2px 0 rgba(255,255,255,.28) !important;
        }
        #ranking-list {
            padding: 8px;
            border: 3px solid #b8792f;
            border-top: 0;
            border-radius: 0 0 18px 18px;
            background: rgba(255, 253, 241, .62);
        }


        /* 2026-06 追加調整: かぶり防止、ロゴ強化、結果ボタン余白 */
        .game-logo {
            filter: drop-shadow(0 8px 0 rgba(105, 60, 22, .18));
        }
        .game-logo .logo-line {
            position: relative;
            max-width: 100%;
            border-width: 4px;
        }
        .game-logo .logo-line-top::before,
        .game-logo .logo-line-top::after {
            content: "🍃";
            font-size: .72em;
            margin: 0 .18em;
            text-shadow: none;
        }
        .game-logo .logo-line-main {
            background:
                radial-gradient(circle at 22% 25%, rgba(255,255,255,.72), transparent 18%),
                linear-gradient(180deg, #fff4a7, #f7c14d 70%, #ee963a);
        }
        .game-logo .logo-line-main::before,

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    where,
    orderBy,
    limit,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAKJf8RNFw8Pnz4dyezwYxzKtneMTaNhYw",
  authDomain: "ritchan-sukkun-donguri.firebaseapp.com",
  projectId: "ritchan-sukkun-donguri",
  storageBucket: "ritchan-sukkun-donguri.firebasestorage.app",
  messagingSenderId: "276678740758",
  appId: "1:276678740758:web:8a9f7321524b42a5675e37"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const SCORES_COLLECTION = "scores";

window.donguriFirebaseReady = true;

window.donguriAddScore = async function(scoreData) {
    return addDoc(collection(db, SCORES_COLLECTION), {
        name: scoreData.name,
        score: scoreData.score,
        clearedStages: scoreData.clearedStages,
        playedAtText: scoreData.playedAtText,
        playedAtMillis: scoreData.playedAtMillis,
        character: scoreData.character,
        category: scoreData.category,
        hidden: false,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp(),
        version: "risu_donguri_v1"
    });
};

window.donguriGetRanking = async function(rankingType = "elementary") {
    const base = [where("hidden", "==", false)];
    if (rankingType === "elementary") base.push(where("category", "==", "elementary"));
    if (rankingType === "junior_plus") base.push(where("category", "==", "junior_plus"));
    const q = query(collection(db, SCORES_COLLECTION), ...base, orderBy("score", "desc"), limit(60));
    const snapshot = await getDocs(q);
    return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
};
</script>

// 2026-06 v15: BGM・効果音。スマホの自動再生制限対策として、ゲームスタートのタップ後に解放する。
const DonguriAudio = (() => {
    let ctx = null;
    let masterGain = null;
    let musicGain = null;
    let sfxGain = null;
    let bgmTimer = null;
    let currentMode = '';
    let step = 0;
    let started = false;
    let lastSfxAt = {};

    const normalMelody = [523.25, 659.25, 783.99, 659.25, 587.33, 698.46, 659.25, 523.25];
    const normalBass = [130.81, 130.81, 174.61, 174.61, 146.83, 146.83, 196.00, 196.00];
    const feverMelody = [783.99, 987.77, 1174.66, 1318.51, 1174.66, 987.77, 1046.50, 1318.51];
    const feverBass = [261.63, 329.63, 392.00, 523.25, 261.63, 329.63, 392.00, 523.25];

    function safeNow() { return ctx ? ctx.currentTime : 0; }

    function init() {
        if (started && ctx && ctx.state !== 'closed') {
            if (ctx.state === 'suspended') ctx.resume();
            return true;
        }
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return false;
            ctx = new AudioContext();
            masterGain = ctx.createGain();
            musicGain = ctx.createGain();
            sfxGain = ctx.createGain();
            masterGain.gain.value = 0.58;
            musicGain.gain.value = 0.24;
            sfxGain.gain.value = 0.86;
            musicGain.connect(masterGain);
            sfxGain.connect(masterGain);
            masterGain.connect(ctx.destination);
            if (ctx.state === 'suspended') ctx.resume();
            started = true;
            return true;
        } catch (e) {
            console.warn('Audio init failed:', e);
            return false;
        }
    }

    function tone(freq, duration = 0.12, volume = 0.16, type = 'sine', when = 0, destination = sfxGain) {
        if (!init()) return;
        const t = safeNow() + when;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, volume), t + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
        osc.connect(gain);
        gain.connect(destination);
        osc.start(t);
        osc.stop(t + duration + 0.03);
    }

    function slideTone(freq1, freq2, duration = 0.16, volume = 0.18, type = 'square', when = 0) {
        if (!init()) return;
        const t = safeNow() + when;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq1, t);
        osc.frequency.exponentialRampToValueAtTime(freq2, t + duration);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(volume, t + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
        osc.connect(gain);
        gain.connect(sfxGain);
        osc.start(t);
        osc.stop(t + duration + 0.03);
    }

    function noise(duration = 0.12, volume = 0.18, when = 0, filterFreq = 1200) {
        if (!init()) return;
        const t = safeNow() + when;
        const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
        const source = ctx.createBufferSource();
        const filter = ctx.createBiquadFilter();
        const gain = ctx.createGain();
        source.buffer = buffer;
        filter.type = 'bandpass';
        filter.frequency.value = filterFreq;
        filter.Q.value = 1.4;
        gain.gain.setValueAtTime(volume, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
        source.connect(filter);
        filter.connect(gain);
        gain.connect(sfxGain);
        source.start(t);
        source.stop(t + duration + 0.02);
    }

    function throttled(key, ms) {
        const now = performance.now();
        if ((lastSfxAt[key] || 0) + ms > now) return true;
        lastSfxAt[key] = now;
        return false;
    }

    function playMusicStep() {
        if (!ctx || currentMode === '') return;
        const isFever = currentMode === 'fever';
        const melody = isFever ? feverMelody : normalMelody;
        const bass = isFever ? feverBass : normalBass;
        const i = step % melody.length;
        const t = 0;
        const melodyType = isFever ? 'square' : 'triangle';
        const bassType = isFever ? 'sawtooth' : 'sine';
        const melodyVolume = isFever ? 0.115 : 0.07;
        const bassVolume = isFever ? 0.07 : 0.045;
        tone(melody[i], isFever ? 0.145 : 0.18, melodyVolume, melodyType, t, musicGain);
        if (step % 2 === 0) tone(bass[i], isFever ? 0.20 : 0.28, bassVolume, bassType, t, musicGain);
        if (isFever && step % 2 === 1) tone(melody[i] * 1.5, 0.07, 0.045, 'triangle', 0.02, musicGain);
        step++;
    }

    function startBgm(mode) {
        if (!init()) return;
        if (currentMode === mode && bgmTimer) return;
        stopBgm(false);
        currentMode = mode;
        step = 0;
        if (musicGain && ctx) {
            musicGain.gain.cancelScheduledValues(ctx.currentTime);
            musicGain.gain.setValueAtTime(0.0001, ctx.currentTime);
            musicGain.gain.exponentialRampToValueAtTime(mode === 'fever' ? 0.30 : 0.22, ctx.currentTime + 0.25);
        }
        playMusicStep();
        bgmTimer = setInterval(playMusicStep, mode === 'fever' ? 145 : 210);
    }

    function stopBgm(clearMode = true) {
        if (bgmTimer) clearInterval(bgmTimer);
        bgmTimer = null;
        if (musicGain && ctx) {
            musicGain.gain.cancelScheduledValues(ctx.currentTime);
            musicGain.gain.setValueAtTime(Math.max(0.0001, musicGain.gain.value), ctx.currentTime);
            musicGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.2);
        }
        if (clearMode) currentMode = '';
    }

    function playStart() {
        if (!init()) return;
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.13, 0.18, 'triangle', i * 0.075));
        noise(0.10, 0.10, 0.26, 2600);
    }

    function playBlockHit(combo = 1) {
        if (throttled('block', 28)) return;
        const base = Math.min(1046.5, 420 + combo * 28);
        tone(base, 0.075, Math.min(0.23, 0.10 + combo * 0.006), 'square');
        tone(base * 1.5, 0.055, 0.05, 'triangle', 0.025);
        if (combo > 1 && combo % 5 === 0) playCombo(combo);
    }

    function playPaddle() {
        if (throttled('paddle', 70)) return;
        slideTone(210, 360, 0.09, 0.09, 'triangle');
    }

    function playShoot() {
        if (throttled('shoot', 65)) return;
        slideTone(620, 1180, 0.08, 0.13, 'square');
        noise(0.045, 0.055, 0.015, 3600);
    }

    function playItem(effect) {
        if (throttled('item', 80)) return;
        const start = effect === 'bullet' ? 660 : effect === 'safety_wall' ? 392 : 523;
        tone(start, 0.10, 0.16, 'triangle');
        tone(start * 1.25, 0.10, 0.15, 'triangle', 0.06);
        tone(start * 1.5, 0.14, 0.16, 'triangle', 0.12);
        noise(0.08, 0.07, 0.09, 2200);
    }

    function playCombo(combo) {
        if (throttled('combo', 120)) return;
        const notes = [783.99, 987.77, 1174.66];
        notes.forEach((f, i) => tone(f + Math.min(combo, 30) * 4, 0.08, 0.11, 'square', i * 0.045));
    }

    function playFeverStart() {
        if (!init()) return;
        stopBgm(false);
        noise(0.30, 0.22, 0, 1800);
        [523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f, i) => tone(f, 0.16, 0.18, 'square', i * 0.055));
        setTimeout(() => startBgm('fever'), 260);
    }

    function playFeverEnd() {
        if (throttled('feverEnd', 800)) return;
        [987.77, 783.99, 659.25].forEach((f, i) => tone(f, 0.12, 0.11, 'triangle', i * 0.055));
    }

    function playLevelUp() {
        if (throttled('level', 500)) return;
        noise(0.16, 0.12, 0, 2400);
        [392, 523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.11, 0.14, 'triangle', i * 0.05));
    }

    function playWall() {
        if (throttled('wall', 200)) return;
        slideTone(180, 90, 0.15, 0.16, 'sawtooth');
        noise(0.10, 0.08, 0.02, 800);
    }

    function playGameOver() {
        stopBgm(false);
        [523.25, 392.00, 329.63, 261.63].forEach((f, i) => tone(f, 0.22, 0.15, 'triangle', i * 0.12));
        noise(0.18, 0.08, 0.34, 700);
    }

    return {
        init,
        startNormalBgm: () => startBgm('normal'),
        startFeverBgm: () => startBgm('fever'),
        stopBgm,
        playStart,
        playBlockHit,
        playPaddle,
        playShoot,
        playItem,
        playFeverStart,
        playFeverEnd,
        playLevelUp,
        playWall,
        playGameOver
    };
})();

function setup() {
    let canvas = createCanvas(400, 600);

    noLoop();
    getRanking();

        card.addEventListener('click', () => setCharacterChoice(card.dataset.character));

    });

        btn.addEventListener('click', () => setRankingType(btn.dataset.ranking));
    });

function draw() {
    if (gameState !== 'playing') return;
    updateComboDisplay();

    push();
    if (screenShake > 0.05) {
        translate(random(-screenShake, screenShake), random(-screenShake, screenShake));
        screenShake *= 0.86;
    } else {
        screenShake = 0;
    }

    drawForestBackground();
    updateItemEffects();
    updatePaddle();
    drawBlocks();
    updateAndDrawItems();
    updateAndDrawBullets();
    updateAndDrawBalls();
    drawSafetyWall();
    drawPaddle();
    updateAndDrawParticles();
    updateAndDrawScorePopups();
    drawFeverOverlay();
    drawBanner();
    pop();

    drawInGameHud();

    if (blocks.length > 0 && blocks.every(b => !b.visible)) {
        advanceForest();
    }
}

function touchStarted() { if (gameState === 'playing') { shoot(); return false; } }
function mousePressed() { if (gameState === 'playing') shoot(); }

function updateGameView() {
    const canvasEl = document.querySelector('#canvas-holder canvas');
    const startContentEl = document.getElementById('start-content');
    const gameOverContentEl = document.getElementById('game-over-content');
    const comboDisplayEl = document.getElementById('combo-display');
    canvasEl.style.display = 'none';
    startContentEl.style.display = 'none';
    gameOverContentEl.style.display = 'none';
    comboDisplayEl.style.display = 'none';
    switch (gameState) {
        case 'start': startContentEl.style.display = 'flex'; break;
        case 'playing': canvasEl.style.display = 'block'; break;
        case 'game_over':
            updateResultCharacterImage();
            gameOverContentEl.style.display = 'flex';
            break;
    }
}

function startGame() {
    DonguriAudio.init();
    DonguriAudio.playStart();
    DonguriAudio.startNormalBgm();
    gameState = 'playing';
    resetGame();
    updateGameView();
    loop();
}

function handleGameOver() {
    DonguriAudio.playGameOver();
    gameState = 'game_over';
    clearInterval(itemSpawnInterval);
    clearTimeout(wallTimer);
    document.getElementById('final-score').textContent = score;
    updateGameView();
    noLoop();
}

function returnToStart() {
    DonguriAudio.stopBgm();
    gameState = 'start';
    clearInterval(itemSpawnInterval);
    clearTimeout(wallTimer);
    isWallActive = false;
    isFeverTime = false;
    comboCount = 0;
    updateGameView();
    noLoop();
}

function getHarvestMessage(value) {
    if (value >= 12000) return '森の伝説レベル！すごすぎる！';
    if (value >= 7000) return '大きな倉庫がいっぱい！';
    if (value >= 3500) return '冬じたく大成功！';
    if (value >= 1200) return 'いい感じに集まったね！';
    return 'また森にあつめに行こう！';
}

function showModal(id) { document.getElementById(id).style.display = 'flex'; }
function hideModal(id) { document.getElementById(id).style.display = 'none'; }

function getCharacterConfig() {
    return CHARACTER_TYPES[selectedCharacterKey] || CHARACTER_TYPES.sukkun;
}

function getSelectedCharacterImage() {

}

}

function getRankingTitle(rankingType) {

function setSubmitCategory(category) {
    if (!['elementary', 'junior_plus'].includes(category)) return;
    selectedSubmitCategory = category;
    document.querySelectorAll('.category-choice').forEach(btn => {
        const selected = btn.dataset.category === selectedSubmitCategory;
        btn.classList.toggle('selected', selected);
        btn.setAttribute('aria-pressed', selected ? 'true' : 'false');
    });
}

function setRankingType(rankingType) {
    if (!['elementary', 'junior_plus', 'all'].includes(rankingType)) return;
    activeRankingType = rankingType;
    document.querySelectorAll('.ranking-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.ranking === activeRankingType);
    });
    getRanking(activeRankingType);
}

function getCharacterLabel(characterKey) {
    return characterKey === 'ricchan' ? 'りっちゃん' : 'すっくん';
}

function getSelectedCharacterData() {
    return selectedCharacterKey === 'ricchan' ? RICCHAN_DATA : SUKKUN_DATA;
}

function getPaddleBaseWidth() {
    return PADDLE_INITIAL_WIDTH + getCharacterConfig().paddleBonus;
}

function initializeCharacterImages() {
    const suImg = document.getElementById('choice-sukkun-img');
    const riImg = document.getElementById('choice-ricchan-img');
    const logoSuImg = document.getElementById('logo-sukkun-img');
    const logoRiImg = document.getElementById('logo-ricchan-img');
    if (suImg) suImg.src = SUKKUN_DATA;
    if (riImg) riImg.src = RICCHAN_DATA;
    if (logoSuImg) logoSuImg.src = SUKKUN_DATA;
    if (logoRiImg) logoRiImg.src = RICCHAN_DATA;

function setCharacterChoice(key) {
    if (!CHARACTER_TYPES[key]) return;
    selectedCharacterKey = key;
    updateCharacterChoiceUI();
    updateResultCharacterImage();
    updateInfoDisplay();
}

function updateCharacterChoiceUI() {
    document.querySelectorAll('.character-card').forEach(card => {
        const selected = card.dataset.character === selectedCharacterKey;
        card.classList.toggle('selected', selected);
        card.setAttribute('aria-pressed', selected ? 'true' : 'false');

function updateResultCharacterImage() {
    const resultImg = document.getElementById('result-character-img');

    if (resultImg) {
        resultImg.src = getSelectedCharacterData();

    }

}

function resetGame() {
    const config = getCharacterConfig();
    const paddleBaseWidth = getPaddleBaseWidth();
    score = 0;
    bulletCount = config.initialShots;
    comboCount = 0;
    level = 1;
    updateInfoDisplay();
    paddle = { x: width / 2 - paddleBaseWidth / 2, y: height - 40, w: paddleBaseWidth, h: PADDLE_HEIGHT, isEnlarged: false, sizeEffectEndTime: 0 };
    balls = [];
    spawnNewBall();
    setupBlocks(false);
    items = [];
    bullets = [];
    particles = [];
    scorePopups = [];
    screenShake = 0;
    isWallActive = false;
    clearTimeout(wallTimer);
    isFeverTime = false;
    feverEndTime = 0;
    clearInterval(itemSpawnInterval);
    itemSpawnInterval = setInterval(() => spawnItem(), 12000);
    showBanner(config.startBanner);

    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'きろくをのこす'; }

    if (playerNameInput) playerNameInput.disabled = false;
    setSubmitCategory('elementary');
}

function setupBlocks(isLevelUp) {
    blocks = [];
    const cols = Math.floor(width / (BLOCK_WIDTH + BLOCK_GAP));
    const rows = 10;
    const blockCount = isLevelUp ? 40 : 25;
    const offsetX = (width - cols * (BLOCK_WIDTH + BLOCK_GAP) + BLOCK_GAP) / 2;
    const palettes = [
        { color: [191, 111, 39], accent: [246, 201, 69], kind: 'acorn' },
        { color: [218, 130, 50], accent: [121, 76, 28], kind: 'leaf' },
        { color: [146, 98, 52], accent: [250, 232, 162], kind: 'basket' },
        { color: [211, 83, 54], accent: [255, 198, 97], kind: 'berry' },
        { color: [137, 173, 75], accent: [252, 228, 134], kind: 'leaf' }
    ];
    let positions = new Set();
    while (blocks.length < blockCount) {
        let r = floor(random(rows));
        let c = floor(random(cols));
        let posKey = `${r},${c}`;
        if (!positions.has(posKey)) {
            positions.add(posKey);
            let palette = random(palettes);
            blocks.push({
                x: c * (BLOCK_WIDTH + BLOCK_GAP) + offsetX,
                y: r * (BLOCK_HEIGHT + BLOCK_GAP) + 50,
                w: BLOCK_WIDTH,
                h: BLOCK_HEIGHT,
                visible: true,
                color: [...palette.color],
                accent: [...palette.accent],
                kind: palette.kind,
                wobble: random(TWO_PI)
            });
        }
    }
}

function advanceForest() {
    level++;
    setupBlocks(true);
    spawnNewBall(width / 2, height / 2);
    updateInfoDisplay();
    screenShake = 5;
    showBanner(`森 ${level}へ！`);
    DonguriAudio.playLevelUp();
    spawnFestivalBurst(width / 2, height / 2, 32);
}

function updateItemEffects() {
    let currentTime = millis();
    if (paddle.isEnlarged && currentTime > paddle.sizeEffectEndTime) paddle.isEnlarged = false;
    balls.forEach(ball => { if (ball.isEnlarged && currentTime > ball.sizeEffectEndTime) ball.isEnlarged = false; });
    if (isFeverTime && currentTime > feverEndTime) {
        isFeverTime = false;
        showBanner('フィーバー終了！');
        DonguriAudio.playFeverEnd();
        DonguriAudio.startNormalBgm();
    }
}

function updatePaddle() {
    const baseWidth = getPaddleBaseWidth();
    paddle.w = paddle.isEnlarged ? baseWidth * 1.5 : baseWidth;
    let targetX = (touches.length > 0) ? touches[0].x : mouseX;
    paddle.x = constrain(targetX - paddle.w / 2, 0, width - paddle.w);
}

function drawForestBackground() {
    // 背景は前景より淡く。弾・ブロック・ボールを邪魔しないよう、森全体を少しかすませる。
    const topColor = isFeverTime ? color(255, 224, 150) : color(214, 238, 198);
    const bottomColor = isFeverTime ? color(255, 185, 128) : color(157, 203, 148);
    noStroke();
    for (let y = 0; y < height; y += 4) {
        const c = lerpColor(topColor, bottomColor, y / height);
        fill(c);
        rect(0, y, width, 4);
    }

    push();
    const sunPulse = 1 + sin(frameCount * 0.04) * 0.04;
    fill(255, 237, 122, 80);
    ellipse(width - 72, 68, 104 * sunPulse, 104 * sunPulse);
    fill(255, 226, 91, 135);
    ellipse(width - 72, 68, 62, 62);
    pop();

    drawCloud(70, 62, 1.0, 70);
    drawCloud(250, 92, .75, 45);

    fill(96, 155, 100, 130);
    beginShape();
    vertex(0, 210);
    bezierVertex(65, 160, 118, 190, 185, 155);
    bezierVertex(260, 116, 316, 168, 400, 135);
    vertex(400, 600);
    vertex(0, 600);
    endShape(CLOSE);

    fill(84, 142, 91, 150);
    beginShape();
    vertex(0, 278);
    bezierVertex(75, 220, 140, 256, 196, 211);
    bezierVertex(265, 166, 337, 235, 400, 194);
    vertex(400, 600);
    vertex(0, 600);
    endShape(CLOSE);

    drawTree(-26, 248, 1.15);
    drawTree(336, 240, 1.05);
    drawTree(26, 328, .82);
    drawTree(302, 340, .82);

    fill(118, 91, 46, 78);
    rect(0, height - 28, width, 28);

function initializeForestLeaves() {
    forestLeaves = [];
    const colors = [[239, 151, 55, 155], [230, 96, 55, 140], [246, 201, 69, 145], [133, 176, 78, 135]];
    for (let i = 0; i < 32; i++) {
        forestLeaves.push({
            x: random(width),
            y: random(-height, height),
            size: random(5, 11),
            speedY: random(.25, .85),
            speedX: random(-.18, .18),
            angle: random(TWO_PI),
            spin: random(-.02, .02),
            seed: random(1000),
            color: random(colors)
        });
    }
}

function updateForestLeaves() {
    for (const leaf of forestLeaves) {
        leaf.y += leaf.speedY * (isFeverTime ? 1.7 : 1);
        leaf.x += leaf.speedX + sin(frameCount * .018 + leaf.seed) * .24;
        leaf.angle += leaf.spin + sin(frameCount * .02 + leaf.seed) * .003;
        if (leaf.y > height + 20) {
            leaf.y = random(-60, -10);
            leaf.x = random(width);
        }
        if (leaf.x < -20) leaf.x = width + 20;
        if (leaf.x > width + 20) leaf.x = -20;
        drawLeafShape(leaf.x, leaf.y, leaf.size, leaf.angle, leaf.color);
    }
}

function drawLeafShape(x, y, s, angle, col) {
    push();
    translate(x, y);
    rotate(angle);

    fill(col[0], col[1], col[2], col[3] ?? 180);
    ellipse(0, 0, s * 1.8, s);
    stroke(92, 64, 23, 80);
    strokeWeight(1);
    line(-s * .65, 0, s * .65, 0);

}

function drawPaddle() {
    push();
    const pulse = paddle.isEnlarged ? sin(frameCount * .18) * 2.5 : 0;
    drawingContext.shadowColor = 'rgba(47, 82, 23, 0.34)';
    drawingContext.shadowBlur = 12;
    drawingContext.shadowOffsetY = 4;

    if (isFeverTime) {
        colorMode(HSB, 360, 100, 100);
        const hue = (frameCount * 3) % 360;
        fill(hue, 82, 92);
        stroke((hue + 60) % 360, 80, 100);
        strokeWeight(2.5);
        rect(paddle.x, paddle.y - pulse, paddle.w, paddle.h + pulse, 9);
        colorMode(RGB, 255);
    } else {
        fill(111, 166, 68);
        stroke(62, 93, 35);
        strokeWeight(2.2);
        rect(paddle.x, paddle.y - pulse, paddle.w, paddle.h + pulse, 9);
        noStroke();
        fill(177, 109, 43, 200);
        rect(paddle.x + 6, paddle.y + paddle.h - 4, paddle.w - 12, 4, 4);
        fill(255, 241, 158, 70);
        rect(paddle.x + 8, paddle.y + 3 - pulse, paddle.w - 16, 4, 999);
    }
    drawingContext.shadowBlur = 0;

    if (paddle.isEnlarged) {
        drawLeafShape(paddle.x + 3, paddle.y + 7, 10, -0.25, [73, 166, 82, 220]);
        drawLeafShape(paddle.x + paddle.w - 3, paddle.y + 7, 10, 0.25, [73, 166, 82, 220]);
    }

    const characterImg = getSelectedCharacterImage();
    if (characterImg) {
        imageMode(CENTER);
        image(characterImg, paddle.x + paddle.w / 2, paddle.y + 29 + sin(frameCount * .12) * 1.2, 34, 34);
        imageMode(CORNER);
    }
    pop();
}

function collideRectCircle(rx, ry, rw, rh, cx, cy, diameter) {
    let testX = cx;
    let testY = cy;
    if (cx < rx) testX = rx; else if (cx > rx + rw) testX = rx + rw;
    if (cy < ry) testY = ry; else if (cy > ry + rh) testY = ry + rh;
    return dist(cx, cy, testX, testY) <= diameter / 2;
}

function updateAndDrawBalls() {
    let currentTime = millis();

    for (let i = balls.length - 1; i >= 0; i--) {
        let ball = balls[i];
        ball.size = ball.isEnlarged ? BALL_INITIAL_SIZE * 2 : BALL_INITIAL_SIZE;
        ball.x += ball.speedX;
        ball.y += ball.speedY;
        ball.rotation += 0.12 * Math.sign(ball.speedX || 1);

        if (ball.x < ball.size / 2 || ball.x > width - ball.size / 2) {
            ball.speedX *= -1;
            ball.x = constrain(ball.x, ball.size / 2, width - ball.size / 2);
            if (currentTime - ball.lastPaddleTouch > PADDLE_TOUCH_TIMEOUT) {
                ball.speedY += random(-1, 1);
                let speed = sqrt(ball.speedX * ball.speedX + ball.speedY * ball.speedY);
                let targetSpeed = 7;
                ball.speedX = (ball.speedX / speed) * targetSpeed;
                ball.speedY = (ball.speedY / speed) * targetSpeed;
                if (abs(ball.speedY) < 2) ball.speedY = ball.speedY > 0 ? 2 : -2;
            }
        }

        if (ball.y < ball.size / 2) {
            ball.speedY *= -1;
            ball.y = ball.size / 2;
            if (currentTime - ball.lastPaddleTouch > PADDLE_TOUCH_TIMEOUT) {
                ball.speedX += random(-1.5, 1.5);
                ball.speedX = constrain(ball.speedX, -8, 8);
            }
        }

        if (isWallActive && ball.y + ball.size / 2 > height - 10) {
            ball.speedY *= -1;
            ball.y = height - 10 - ball.size / 2;
            screenShake = max(screenShake, 2.5);
            DonguriAudio.playWall();
            spawnScorePopup(ball.x, height - 34, 'セーフ！');
        } else if (ball.y > height) {
            balls.splice(i, 1);
            if (balls.length > 0) {
                comboCount = 0;
            } else {
                handleGameOver();
            }
            continue;
        }

        if (collideRectCircle(paddle.x, paddle.y, paddle.w, paddle.h, ball.x, ball.y, ball.size)) {
            ball.speedY = -abs(ball.speedY);
            ball.y = paddle.y - ball.size / 2;
            let hitPosition = (ball.x - paddle.x) / paddle.w;
            let centerOffset = hitPosition - 0.5;
            let angleAdjustment = centerOffset * 6;
            ball.speedX += angleAdjustment;
            ball.speedX = constrain(ball.speedX, -8, 8);
            ball.lastPaddleTouch = currentTime;
            increaseBallSpeed(ball);
            comboCount = 0;
            DonguriAudio.playPaddle();
            spawnTinyBounce(ball.x, ball.y + ball.size / 2);
        }

        for (let block of blocks) {
            if (block.visible && collideRectCircle(block.x, block.y, block.w, block.h, ball.x, ball.y, ball.size)) {
                if (!isFeverTime) ball.speedY *= -1;
                block.visible = false;
                comboCount++;
                triggerComboAnimation();
                if (comboCount >= FEVER_THRESHOLD && !isFeverTime) {
                    startFever();
                }
                let scoreToAdd = 10 * comboCount;
                if (isFeverTime) scoreToAdd *= 2;
                score += scoreToAdd;
                screenShake = min(7, screenShake + (isFeverTime ? 1.7 : .85));
                DonguriAudio.playBlockHit(comboCount);
                spawnHarvestBurst(block.x + block.w / 2, block.y + block.h / 2, block);
                spawnScorePopup(block.x + block.w / 2, block.y, `+${scoreToAdd}`);
                increaseBallSpeed(ball);
                updateInfoDisplay();
                if (comboCount > 0 && comboCount % 5 === 0) {
                    spawnItem(block.x + block.w / 2, block.y + block.h / 2);
                }
                if (!isFeverTime) break;
            }
        }

        drawPineconeBall(ball.x, ball.y, ball.size, ball.rotation, isFeverTime);
    }
    if (balls.length === 0 && gameState === 'playing') handleGameOver();
}

function startFever() {
    isFeverTime = true;
    feverEndTime = millis() + FEVER_DURATION;
    screenShake = 8;
    showBanner('どんぐりフィーバー！');
    DonguriAudio.playFeverStart();
    spawnFestivalBurst(width / 2, height / 2, 42);
}

function updateComboDisplay() {
    const el = document.getElementById('combo-display');
    if (isFeverTime) {
        const remainingTime = Math.max(0, (feverEndTime - millis()) / 1000);
        const comboText = `${comboCount} COMBO`;
        const feverText = `<span class="fever-text">どんぐりフィーバー！</span>`;
        const timerText = `<span class="fever-timer">${remainingTime.toFixed(1)}s</span>`;
        el.innerHTML = `${comboText}<br>${feverText}<br>${timerText}`;
        el.style.display = 'block';
    } else if (comboCount > 1) {
        el.innerHTML = `${comboCount} COMBO`;
        el.style.display = 'block';
    } else {
        el.style.display = 'none';
    }
}

function triggerComboAnimation() {
    const el = document.getElementById('combo-display');
    el.classList.add('active');
    setTimeout(() => el.classList.remove('active'), 100);
}

function drawBlocks() {
    strokeWeight(BLOCK_GAP);
    for (let block of blocks) {
        if (!block.visible) continue;
        push();
        translate(block.x, block.y);
        const bob = isFeverTime ? sin(frameCount * .12 + block.wobble) * 1.2 : 0;
        translate(0, bob);
        drawingContext.shadowColor = 'rgba(75, 43, 14, 0.28)';
        drawingContext.shadowBlur = 5;
        drawingContext.shadowOffsetY = 3;
        fill(block.color[0], block.color[1], block.color[2]);
        stroke(isFeverTime ? color(255, 236, 92) : color(92, 55, 23));
        strokeWeight(isFeverTime ? 2.2 : 1.4);
        rect(0, 0, block.w, block.h, 6);
        drawingContext.shadowBlur = 0;
        noStroke();
        fill(255, 241, 164, 70);
        rect(4, 3, block.w - 8, 4, 999);
        fill(block.accent[0], block.accent[1], block.accent[2], 180);
        if (block.kind === 'acorn') {
            drawTinyAcorn(block.w / 2, block.h / 2 + 1, 15);
        } else if (block.kind === 'leaf') {
            drawLeafShape(block.w / 2, block.h / 2 + 1, 9, sin(frameCount * .02 + block.wobble) * .35, [...block.accent, 210]);
        } else if (block.kind === 'basket') {
            stroke(99, 61, 23, 110);
            strokeWeight(1.2);
            line(9, 7, block.w - 9, 7);
            line(9, 13, block.w - 9, 13);
            noStroke();
            drawTinyAcorn(block.w / 2 - 8, block.h / 2 + 2, 10);
            drawTinyAcorn(block.w / 2 + 8, block.h / 2 + 2, 10);
        } else {
            fill(255, 232, 128, 170);
            ellipse(block.w / 2 - 7, block.h / 2 + 1, 8, 8);
            ellipse(block.w / 2 + 6, block.h / 2 - 1, 7, 7);
            ellipse(block.w / 2 + 13, block.h / 2 + 3, 6, 6);
        }
        pop();
    }
    noStroke();
}

function updateAndDrawItems() {
    for (let i = items.length - 1; i >= 0; i--) {
        let item = items[i];
        item.y += 2;
        item.angle += .045;
        drawHarvestItem(item);
        if (collideRectCircle(paddle.x, paddle.y, paddle.w, paddle.h, item.x, item.y, 24)) {
            applyItemEffect(item.type.effect, item.x, item.y, item.type.label);
            spawnPickupBurst(item.x, item.y, item.type.color);
            items.splice(i, 1);
        } else if (item.y > height + 20) {
            items.splice(i, 1);
        }
    }
}

function drawHarvestItem(item) {
    push();
    translate(item.x, item.y);
    rotate(sin(frameCount * .08 + item.seed) * .2 + item.angle * .1);
    drawingContext.shadowColor = 'rgba(61, 35, 10, .35)';
    drawingContext.shadowBlur = 10;
    fill(item.type.color[0], item.type.color[1], item.type.color[2]);
    stroke(255, 248, 203);
    strokeWeight(2.5);
    ellipse(0, 0, 25, 25);
    drawingContext.shadowBlur = 0;
    noStroke();
    if (item.type.icon === 'twig') {
        drawTwigShot(0, 0, 17, item.angle);
    } else if (item.type.icon === 'pinecone') {
        drawPinecone(0, 0, 15);
    } else if (item.type.icon === 'leaf') {
        drawLeafShape(0, 0, 11, -0.2, [255, 255, 255, 190]);
    } else if (item.type.icon === 'acorn') {
        drawTinyAcorn(0, 1, 15);
    } else if (item.type.icon === 'sparkle') {
        drawSparkle(0, 0, 12, color(255, 255, 255, 235));
    } else if (item.type.icon === 'mushroom') {
        drawMushroom(0, 2, 16);
    }
    pop();
}

function updateAndDrawBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
        let bullet = bullets[i];
        bullet.y -= 10;
        bullet.spin += .18;
        drawTwigShot(bullet.x, bullet.y, 18, bullet.spin);
        let hit = false;
        for (let block of blocks) {
            if (block.visible && bullet.x > block.x && bullet.x < block.x + block.w && bullet.y > block.y && bullet.y < block.y + block.h) {
                block.visible = false;
                score += 10;
                DonguriAudio.playBlockHit(1);
                spawnHarvestBurst(block.x + block.w / 2, block.y + block.h / 2, block);
                spawnScorePopup(block.x + block.w / 2, block.y, '+10');
                screenShake = max(screenShake, 2.4);
                updateInfoDisplay();
                hit = true;
                break;
            }
        }
        if (hit || bullet.y < -20) bullets.splice(i, 1);
    }
}

function increaseBallSpeed(ball) {
    const MAX_SPEED = 12;
    let speedVec = createVector(ball.speedX, ball.speedY);
    if (speedVec.mag() < MAX_SPEED) {
        speedVec.mult(1.03);
        ball.speedX = speedVec.x;
        ball.speedY = speedVec.y;
    }
}

function updateInfoDisplay() {
    const characterDisplay = document.getElementById('character-display');
    if (characterDisplay) characterDisplay.textContent = getCharacterConfig().name;

    const scoreDisplay = document.getElementById('score-display');
    if (scoreDisplay) scoreDisplay.textContent = 'あつめたどんぐり: ' + score;

    const bulletDisplay = document.getElementById('bullet-display');
    if (bulletDisplay) bulletDisplay.textContent = '小枝: ' + bulletCount;

    const levelDisplay = document.getElementById('level-display');
    if (levelDisplay) levelDisplay.textContent = '森: ' + level;
}

function spawnNewBall(x = width / 2, y = height / 2, templateBall = null) {
    if (balls.length >= MAX_BALLS) return;
    let newBall = {
        x: x,
        y: y,
        speedX: random(-INITIAL_BALL_SPEED_X_RANGE, INITIAL_BALL_SPEED_X_RANGE),
        speedY: INITIAL_BALL_SPEED_Y,
        isEnlarged: templateBall ? templateBall.isEnlarged : false,
        sizeEffectEndTime: templateBall ? templateBall.sizeEffectEndTime : 0,
        lastPaddleTouch: millis(),
        size: BALL_INITIAL_SIZE,
        rotation: random(TWO_PI)
    };
    if (abs(newBall.speedX) < 1.2) newBall.speedX = random([ -1.8, 1.8 ]);
    balls.push(newBall);
}

function spawnItem(x = random(20, width - 20), y = 0) {
    if (gameState !== 'playing' || isFeverTime) return;
    const itemKeys = Object.keys(ITEM_TYPES);
    const randomKey = random(itemKeys);
    items.push({ x: x, y: y, type: ITEM_TYPES[randomKey], angle: random(TWO_PI), seed: random(1000) });
}

function shoot() {
    if (bulletCount > 0) {
        bullets.push({ x: paddle.x + paddle.w / 2, y: paddle.y - 6, spin: random(TWO_PI) });
        bulletCount--;
        DonguriAudio.playShoot();
        updateInfoDisplay();
    }
}

function applyItemEffect(effect, x = width / 2, y = height / 2, label = 'ゲット！') {
    let currentTime = millis();
    const config = getCharacterConfig();
    const effectDuration = PADDLE_BALL_SIZE_DURATION + config.effectBonus;
    const wallDuration = WALL_DURATION + config.wallBonus;
    let displayLabel = label;
    switch (effect) {
        case 'bullet': {
            const addedShots = 5 + config.bulletBonus;
            bulletCount += addedShots;
            displayLabel = `小枝+${addedShots}`;
            break;
        }
        case 'paddle_size':
            paddle.isEnlarged = true;
            paddle.sizeEffectEndTime = currentTime + effectDuration;
            break;
        case 'ball_size':
            balls.forEach(b => { b.isEnlarged = true; b.sizeEffectEndTime = currentTime + effectDuration; });
            break;
        case 'ball_split':
            const currentBalls = [...balls];
            for (const ball of currentBalls) spawnNewBall(ball.x, ball.y, ball);
            break;
        case 'safety_wall':
            isWallActive = true;
            clearTimeout(wallTimer);
            wallTimer = setTimeout(() => { isWallActive = false; }, wallDuration);
            break;
    }
    DonguriAudio.playItem(effect);
    spawnScorePopup(x, y, displayLabel);
    updateInfoDisplay();
}

function drawSafetyWall() {
    if (!isWallActive) return;
    push();
    noStroke();
    fill(55, 176, 95, 115);
    rect(0, height - 13, width, 13);
    stroke(245, 255, 220, 180);
    strokeWeight(2);
    for (let x = 0; x < width; x += 18) {
        line(x, height - 11, x + 16, height - 3);
        line(x + 16, height - 11, x, height - 3);
    }
    noStroke();
    for (let x = 12; x < width; x += 34) drawMushroom(x, height - 10, 13);
    pop();
}

function drawPineconeBall(x, y, s, rotation, fever) {
    push();
    translate(x, y);
    rotate(rotation);
    if (fever) {
        drawingContext.shadowColor = 'rgba(255, 236, 78, .95)';
        drawingContext.shadowBlur = 20;
        stroke(255, 111, 53);
        strokeWeight(max(1.5, s * .12));
    } else {
        drawingContext.shadowColor = 'rgba(50, 30, 8, .35)';
        drawingContext.shadowBlur = 7;
        stroke(67, 43, 19);
        strokeWeight(max(1, s * .08));
    }
    fill(fever ? color(172, 102, 34) : color(118, 70, 29));
    ellipse(0, 0, s * .72, s * 1.05);
    stroke(fever ? color(255, 224, 96, 210) : color(205, 143, 70, 180));
    strokeWeight(max(1, s * .07));
    for (let yy = -s * .28; yy <= s * .32; yy += s * .18) {
        line(-s * .23, yy, s * .22, yy + s * .12);
        line(s * .23, yy, -s * .22, yy + s * .12);
    }
    noStroke();
    fill(255, 239, 156, fever ? 130 : 70);
    ellipse(-s * .12, -s * .2, s * .16, s * .25);
    drawingContext.shadowBlur = 0;
    pop();
}

function drawTwigShot(x, y, s, spin) {
    push();
    translate(x, y);
    rotate(spin);
    drawingContext.shadowColor = 'rgba(50, 30, 8, .28)';
    drawingContext.shadowBlur = 5;
    stroke(101, 64, 28);
    strokeWeight(max(2, s * .18));
    strokeCap(ROUND);
    line(0, s * .45, 0, -s * .45);
    strokeWeight(max(1.3, s * .1));
    line(0, -s * .12, s * .32, -s * .38);
    line(0, s * .08, -s * .28, -s * .18);
    stroke(214, 143, 64, 170);
    strokeWeight(max(1, s * .06));
    line(-s * .05, s * .35, -s * .05, -s * .35);
    drawingContext.shadowBlur = 0;
    pop();
}

function drawAcorn(x, y, s, rotation, fever) {

    translate(x, y);
    rotate(rotation * .35);
    if (fever) {
        drawingContext.shadowColor = 'rgba(255, 236, 78, .9)';
        drawingContext.shadowBlur = 18;

    }
    stroke(81, 49, 20);

    fill(fever ? color(255, 221, 58) : color(164, 94, 36));
    ellipse(0, s * .12, s * .82, s * .9);
    fill(fever ? color(139, 82, 23) : color(98, 59, 25));
    arc(0, -s * .2, s * .95, s * .55, PI, TWO_PI, CHORD);
    noStroke();
    fill(255, 240, 148, fever ? 190 : 100);
    ellipse(-s * .13, s * .05, s * .18, s * .26);
    stroke(81, 49, 20);
    strokeWeight(max(1, s * .07));
    line(0, -s * .45, s * .12, -s * .66);
    drawingContext.shadowBlur = 0;
    pop();
}

function drawTinyAcorn(cx, cy, s) {

    stroke(89, 55, 24, 180);
    strokeWeight(1);
    fill(167, 94, 35);
    ellipse(0, s * .08, s * .68, s * .78);
    fill(93, 58, 26);
    arc(0, -s * .17, s * .76, s * .44, PI, TWO_PI, CHORD);
    noStroke();
    fill(255, 230, 126, 95);
    ellipse(-s * .12, 0, s * .13, s * .19);
    stroke(89, 55, 24, 160);
    line(0, -s * .37, s * .11, -s * .52);

}

function drawPinecone(x, y, s) {
    push();
    translate(x, y);
    fill(118, 70, 29);
    stroke(67, 43, 19);
    strokeWeight(1);
    ellipse(0, 0, s * .72, s);
    stroke(205, 143, 70, 180);
    for (let yy = -s * .25; yy <= s * .3; yy += s * .2) {
        line(-s * .22, yy, s * .2, yy + s * .12);
        line(s * .22, yy, -s * .2, yy + s * .12);
    }
    pop();
}

function drawFlyingPinecone(x, y, s, spin) {
    push();
    translate(x, y);
    rotate(spin);
    drawingContext.shadowColor = 'rgba(50, 30, 8, .35)';
    drawingContext.shadowBlur = 6;
    drawPinecone(0, 0, s);
    drawingContext.shadowBlur = 0;
    pop();
}

function drawMushroom(x, y, s) {
    push();
    translate(x, y);
    noStroke();
    fill(255, 241, 206);
    rect(-s * .18, -s * .05, s * .36, s * .45, 4);
    fill(225, 73, 57);
    arc(0, -s * .06, s, s * .72, PI, TWO_PI, CHORD);
    fill(255, 235, 208, 190);
    ellipse(-s * .22, -s * .18, s * .16, s * .12);
    ellipse(s * .13, -s * .24, s * .13, s * .1);
    pop();
}

function drawSparkle(x, y, s, col) {
    push();
    translate(x, y);
    fill(col);
    noStroke();
    beginShape();
    vertex(0, -s);
    vertex(s * .22, -s * .22);
    vertex(s, 0);
    vertex(s * .22, s * .22);
    vertex(0, s);
    vertex(-s * .22, s * .22);
    vertex(-s, 0);
    vertex(-s * .22, -s * .22);
    endShape(CLOSE);
    pop();
}

function updateAndDrawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += .09;
        p.vx *= .99;
        p.angle += p.spin;
        p.life--;
        const alpha = map(p.life, 0, p.maxLife, 0, p.color[3] ?? 220, true);
        if (p.kind === 'leaf') {
            drawLeafShape(p.x, p.y, p.size, p.angle, [p.color[0], p.color[1], p.color[2], alpha]);
        } else if (p.kind === 'acorn') {
            push();
            tint(255, alpha);
            drawTinyAcorn(p.x, p.y, p.size);
            noTint();
            pop();
        } else if (p.kind === 'sparkle') {
            drawSparkle(p.x, p.y, p.size, color(p.color[0], p.color[1], p.color[2], alpha));
        } else {
            noStroke();
            fill(p.color[0], p.color[1], p.color[2], alpha);
            ellipse(p.x, p.y, p.size, p.size);
        }
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function updateAndDrawScorePopups() {

        p.y += p.vy;
        p.vy *= .98;
        p.life--;
        const alpha = map(p.life, 0, p.maxLife, 0, 255, true);
        push();
        textAlign(CENTER, CENTER);
        textSize(p.text.includes('+') ? 17 : 13);
        textStyle(BOLD);
        stroke(94, 55, 22, alpha);
        strokeWeight(4);
        fill(255, 247, 132, alpha);
        text(p.text, p.x, p.y);
        pop();
        if (p.life <= 0) scorePopups.splice(i, 1);
    }
}

    if (!selectedSubmitCategory) { alert('ランキングをえらんでね。'); return; }
    playerNameInput.disabled = true;
    document.getElementById('submit-score-btn').disabled = true;
    document.getElementById('submit-score-btn').textContent = '送信中...';

}

async function sendScore(playerName, playerScore, category) {
    try {
        if (!window.donguriAddScore) throw new Error('Firebaseの準備ができていません');
        const playedAt = new Date();
        await window.donguriAddScore({
            name: playerName,
            score: Math.floor(playerScore),
            clearedStages: Math.max(0, level - 1),
            playedAtText: formatPlayedAt(playedAt),
            playedAtMillis: playedAt.getTime(),
            character: selectedCharacterKey,
            category: category
        });
        alert(`${getCategoryLabel(category)}のきろくに登録しました！`);
        getRanking(category);
        activeRankingType = category;
        document.querySelectorAll('.ranking-tab').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.ranking === activeRankingType);
        });
    } catch (error) {
        console.error('スコアの送信に失敗しました:', error);
        alert('きろくの送信に失敗しました。Firebaseのルールやインデックスを確認してください。');
    } finally {
        const btn = document.getElementById('submit-score-btn');
        if (btn) { btn.disabled = false; btn.textContent = 'きろくをのこす'; }
        const playerNameInput = document.getElementById('player-name');
        if (playerNameInput) playerNameInput.disabled = false;
    }
}


function escapeHtml(value) {
    return String(value).replace(/[&<>'"]/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
    }[char]));
}

function formatPlayedAt(date) {
    if (!(date instanceof Date) || Number.isNaN(date.getTime())) return '記録なし';
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    const hh = String(date.getHours()).padStart(2, '0');
    const mm = String(date.getMinutes()).padStart(2, '0');
    return `${y}/${m}/${d} ${hh}:${mm}`;
}

function getPlayedAtText(player) {
    if (player.playedAtText) return player.playedAtText;
    if (player.playedAtMillis) return formatPlayedAt(new Date(player.playedAtMillis));
    if (player.createdAt && typeof player.createdAt.toDate === 'function') return formatPlayedAt(player.createdAt.toDate());
    return '記録なし';
}

function getClearedStages(player) {
    const value = Number(player.clearedStages || 0);
    return Number.isFinite(value) ? Math.max(0, value) : 0;
}

function getRankingNameKey(player) {
    const rawName = String(player && player.name ? player.name : '').trim();
    if (!rawName) return `__no_name_${player && player.id ? player.id : Math.random()}`;
    return rawName.normalize('NFKC').replace(/\s+/g, ' ').toLocaleLowerCase('ja-JP');
}

function getBestScoresByName(rankingData) {
    const bestByName = new Map();
    for (const player of rankingData) {
        const key = getRankingNameKey(player);
        const current = bestByName.get(key);
        const score = Number(player.score || 0);
        const currentScore = current ? Number(current.score || 0) : -Infinity;
        if (!current || score > currentScore) {
            bestByName.set(key, player);
        }
    }
    return Array.from(bestByName.values())
        .sort((a, b) => Number(b.score || 0) - Number(a.score || 0));
}

async function getRanking(rankingType = activeRankingType) {
    activeRankingType = rankingType;
    const rankingList = document.getElementById('ranking-list');
    const rankingTitle = document.getElementById('ranking-title');
    if (rankingTitle) rankingTitle.textContent = getRankingTitle(activeRankingType);
    document.querySelectorAll('.ranking-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.ranking === activeRankingType);
    });
    rankingList.innerHTML = '<li>森の掲示板を読み込み中...</li>';
    try {
        if (!window.donguriGetRanking) throw new Error('Firebaseの準備ができていません');
        const rawRankingData = await window.donguriGetRanking(activeRankingType);
        const rankingData = getBestScoresByName(rawRankingData).slice(0, 10);
        rankingList.innerHTML = '';
        if (rankingData.length === 0) {
            rankingList.innerHTML = '<li>まだ誰も収穫していません。一番乗りを目指そう！</li>';
            return;
        }

        const note = document.createElement('li');
        note.className = 'ranking-note';
        note.textContent = '同じ名前は最高得点だけ表示しています。';
        rankingList.appendChild(note);

        const head = document.createElement('li');
        head.className = 'ranking-head';
        head.innerHTML = '<span>順位</span><span>なまえ</span><span style="text-align:right;">スコア</span><span aria-hidden="true"></span>';
        rankingList.appendChild(head);

        rankingData.forEach((player, index) => {
            const li = document.createElement('li');
            li.className = 'ranking-row';
            const crown = index === 0 ? '👑' : '';
            const characterName = getCharacterLabel(player.character);
            const categoryText = getCategoryLabel(player.category);
            const safeName = String(player.name || '');
            const detailId = `rank-more-${index}-${Date.now()}`;
            li.innerHTML = `
                <span class="rank-place"><span class="rank-crown">${crown}</span><span class="rank-number">${index + 1}位</span></span>
                <span class="rank-name">${escapeHtml(safeName)}</span>
                <span class="rank-score">${Math.floor(player.score || 0)}こ</span>
                <span class="rank-detail-cell"><button class="rank-detail-btn" type="button" aria-expanded="false" aria-controls="${detailId}" aria-label="詳細を表示">▼</button></span>
                <span class="rank-more" id="${detailId}">
                    <strong>使用キャラ：</strong>${characterName}　<strong>ランキング：</strong>${categoryText}<br>
                    <strong>プレイ日時：</strong>${getPlayedAtText(player)}　<strong>クリアステージ：</strong>${getClearedStages(player)}
                </span>
            `;
            const detailBtn = li.querySelector('.rank-detail-btn');
            detailBtn.addEventListener('click', () => {
                const isOpen = li.classList.toggle('open');
                detailBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
                detailBtn.textContent = isOpen ? '▲' : '▼';
                detailBtn.setAttribute('aria-label', isOpen ? '詳細を閉じる' : '詳細を表示');
            });
            rankingList.appendChild(li);
        });
    } catch (error) {
        console.error('ランキングの取得に失敗しました:', error);
        rankingList.innerHTML = '<li>森の掲示板を読み込めませんでした。Firestoreのルールやインデックスを確認してください。</li>';
    }
}
