        height: 100dvh;
        max-width: 100vw;
        max-height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }
    .note {

    }

  function makeTile(type = Math.floor(Math.random() * activeColors), kind = 'color') {

  }

  function makeLionTile() {

  function tileMatchKey(t) {
    if (!t) return null;
    return t.kind === 'lion' ? 'lion' : t.type;
  }

  function isLionTile(t) {
    return t && t.kind === 'lion';
  }

  function compactLiftedTilesByColumn(tiles) {
    const byCol = new Map();
    for (const t of tiles) {
      if (!byCol.has(t.col)) byCol.set(t.col, []);
      byCol.get(t.col).push(t);
    }
    for (const colTiles of byCol.values()) {
      colTiles.sort((a, b) => b.row - a.row);
      let r = Math.max(...colTiles.map(t => t.row));
      for (const t of colTiles) {
        t.row = r--;
      }
    }
  }

  function placeGround(t, r, c, instant = false) {
    t.row = r; t.col = c;
    t.tx = gridToX(c); t.ty = gridToY(r);
    if (instant) { t.x = t.tx; t.y = t.ty; }
    ground[r][c] = t;
  }

  function typeAtGround(r, c) {
    const t = ground[r]?.[c];
    return t && t.kind === 'color' ? t.type : null;
  }

  function wouldCreateMatch(r, c, type) {
    const l1 = c - 1 >= 0 ? typeAtGround(r, c - 1) : null;
    const l2 = c - 2 >= 0 ? typeAtGround(r, c - 2) : null;
    const d1 = r + 1 < ROWS ? typeAtGround(r + 1, c) : null;
    const d2 = r + 2 < ROWS ? typeAtGround(r + 2, c) : null;
    return (l1 === type && l2 === type) || (d1 === type && d2 === type);
  }

  function initBoard() {
    ground = createGrid();
    falling = [];
    floatGroups = [];
    launchers = [];
    particles = [];
    floatTexts = [];
    shockwaves = [];
    sparkLines = [];
    cutins = [];
    drag = null;
    pointer = null;
    selectedHint = null;
    tileId = 1;
    groupId = 1;
    activeColors = 5;

    for (let c = 0; c < COLS; c++) {
      const fill = 5 + Math.floor(Math.random() * 2);
      for (let i = 0; i < fill; i++) {
        const r = ROWS - 1 - i;
        let type = Math.floor(Math.random() * activeColors);
        let attempts = 0;
        while (attempts++ < 20 && wouldCreateMatch(r, c, type)) {
          type = Math.floor(Math.random() * activeColors);
        }
        placeGround(makeTile(type), r, c, true);
      }
    }
    seedNearMatches();
  }

  function seedNearMatches() {
    // Two obvious near-matches, but not auto-resolving. They only trigger if the player touches them.
    const r = ROWS - 2;
    if (ground[r]?.[1] && ground[r]?.[2] && ground[r]?.[3]) {
      ground[r][1].type = 0;
      ground[r][2].type = 0;
      ground[r][3].type = 1;
      ground[r][1].flash = .25;
      ground[r][2].flash = .25;
    }
    if (ground[ROWS - 4]?.[5] && ground[ROWS - 3]?.[5] && ground[ROWS - 2]?.[5]) {
      ground[ROWS - 4][5].type = 2;
      ground[ROWS - 3][5].type = 3;
      ground[ROWS - 2][5].type = 2;
    }
  }


  function setupFirebaseRanking() {
    try {
      if (!window.firebase || !window.firebase.initializeApp || !window.firebase.firestore) {
        rankingStatus = 'Firebase未読込';
        return;
      }
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      firebaseDb = firebase.firestore();
      rankingStatus = 'ランキング読込中...';
      loadRanking();
    } catch (err) {
      console.warn('Firebase init failed', err);
      rankingStatus = 'ランキング未接続';
      firebaseDb = null;
    }
  }

  async function loadRanking() {
    if (!firebaseDb || rankingLoading) return;
    rankingLoading = true;
    rankingStatus = 'ランキング読込中...';
    try {
      const snap = await firebaseDb.collection(SCORE_COLLECTION)
        .orderBy('score', 'desc')
        .limit(10)
        .get();
      ranking = snap.docs.map(doc => {
        const d = doc.data() || {};
        return {
          name: String(d.name || 'ななし').slice(0, 14),
          score: Number(d.score || 0),
          maxCombo: Number(d.maxCombo || 0),
          launch: Number(d.launch || 0),
          aerial: Number(d.aerial || 0),
        };
      });
      rankingStatus = ranking.length ? '' : 'まだランキングがありません';
    } catch (err) {
      console.warn('Ranking load failed', err);
      rankingStatus = 'ランキング読込エラー';
    } finally {
      rankingLoading = false;
    }
  }

  function sanitizePlayerName(name) {
    return String(name || '')
      .replace(/[\r\n\t]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, 14);
  }

  async function submitScoreToRanking(name) {
    if (!firebaseDb || submittingScore || scoreSubmitted || score <= 0) return;
    const cleanName = sanitizePlayerName(name);
    if (!cleanName) {
      addFloatText(W / 2, 520, '名前を入力してね', 16, '#ffccd2', .8);
      return;
    }
    submittingScore = true;
    rankingStatus = 'スコア送信中...';
    try {
      await firebaseDb.collection(SCORE_COLLECTION).add({
        name: cleanName,
        score: Math.floor(score),
        maxCombo: Math.floor(maxCombo),
        launch: Math.floor(totalLaunched),
        aerial: Math.floor(totalAerial),
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        version: 'sansan-rocket-puzzle-v1'
      });
      playerName = cleanName;
      localStorage.setItem('sansanRocketPlayerName', cleanName);
      scoreSubmitted = true;
      rankingStatus = '送信しました!';
      addFloatText(W / 2, 518, 'ランキング送信OK!', 17, '#b9f4ff', .9);
      await loadRanking();
    } catch (err) {
      console.warn('Score submit failed', err);
      rankingStatus = '送信エラー';
      addFloatText(W / 2, 518, '送信できませんでした', 16, '#ffccd2', .9);
    } finally {
      submittingScore = false;
    }
  }

  function promptAndSubmitScore() {
    if (scoreSubmitted || submittingScore || !gameOverScoreReady) return;
    const initial = playerName || '';
    const entered = window.prompt('ランキングにのせる名前を入力してください（14文字まで）', initial);
    if (entered == null) return;
    const clean = sanitizePlayerName(entered);
    if (!clean) {
      addFloatText(W / 2, 520, '名前を入力してね', 16, '#ffccd2', .8);
      return;
    }
    submitScoreToRanking(clean);
  }

  function promptRegisterName() {
    const initial = playerName || '';
    const entered = window.prompt('ランキング用の名前を登録してください（14文字まで）', initial);
    if (entered == null) return;
    const clean = sanitizePlayerName(entered);
    if (!clean) {
      addFloatText(W / 2, 666, '名前を入力してね', 15, '#ffccd2', .7);
      return;
    }
    playerName = clean;
    localStorage.setItem('sansanRocketPlayerName', clean);
    addFloatText(W / 2, 666, `名前: ${clean}`, 15, '#b9f4ff', .75);
  }

  function resetGame() {
    score = 0;
    displayedScore = 0;
    combo = 0;
    comboHold = 0;
    comboHoldMax = 0;
    maxCombo = 0;
    sunGauge = 0;
    fever = 0;
    timeLeft = GAME_SECONDS;
    danger = 8;
    lastRoarReady = false;
    lastLionAwardCombo = 0;
    dangerStage = 0;
    crashActive = false;
    crashTimer = 0;
    crashStage = 0;
    crashWarningColumns = [];
    gameOverTimer = 0;
    gameOverScoreReady = false;
    scoreSfxPlayed = false;
    scoreSubmitted = false;
    forcedCrashColumns = [];
    softWarningCooldown = 0;
    totalLaunched = 0;
    totalIgnited = 0;
    totalAerial = 0;
    spawnTimer = .36;
    spawnInterval = .9;
    gameStartedAt = performance.now();
    shake = 0;
    flash = 0;
    cutinFreeze = 0;
    paused = false;
    initBoard();
    gameState = State.PLAY;
    startBgm();
  }

  function endGame() {
    if (gameState === State.OVER) return;
    gameState = State.OVER;
    drag = null;
    pointer = null;
    selectedHint = null;
    gameOverTimer = 5.0;
    gameOverScoreReady = false;
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('sunnyMeteorFloatBest', String(bestScore));
    }
    cutins = [];
    stopBgm();
    triggerGameOverBurst();
    flash = Math.max(flash, .62);
    shake += 1.55;
    playFileSfx('gameover', 1);
    playTone('over', 1.05);
    vibrate(60);
  }

  function triggerGameOverBurst() {
    const debris = [];
    const pushDebris = (tile, x = tile.x, y = tile.y) => {
      const dx = (x + TILE / 2) - W / 2;
      const dy = (y + TILE / 2) - (BOARD_Y + BOARD_H * .42);
      const a = Math.atan2(dy, dx) + rand(.55, -.55);
      const p = 240 + rand(260);
      debris.push({
        tile, x, y,
        vx: Math.cos(a) * p,
        vy: Math.sin(a) * p - 520 - rand(220),
        rot: tile.rot, spin: rand(11, -11)
      });
    };
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = ground?.[r]?.[c];
        if (t) { pushDebris(t); ground[r][c] = null; }
      }
    }
    for (const t of falling) pushDebris(t);
    falling = [];
    for (const g of floatGroups) {
      for (const t of g.tiles) pushDebris(t, t.x, t.y);
    }
    floatGroups = [];
    if (debris.length) {
      launchers.push({ tiles: debris, age: 0, color: '#ff6b75', fever: false, mass: debris.length, gameOver: true });
    }
    addShockwave(W / 2, BOARD_Y + BOARD_H * .36, 320, 'rgba(255,83,98,.92)', .9);
    addShockwave(W / 2, BOARD_Y + BOARD_H * .58, 230, 'rgba(255,235,150,.70)', .62);
    for (let i = 0; i < 70; i++) addParticle(W / 2 + rand(150, -150), BOARD_Y + rand(BOARD_H * .75, 30), i % 3 ? '#ff6b75' : '#fff58c', 1, 320, 'spark');
  }

  function initAudio() {
    if (audio || muted) return;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ac = new Ctx();
      const master = ac.createGain();
      master.gain.value = .32;
      master.connect(ac.destination);
      audio = { ac, master };
    } catch (e) { muted = true; }
  }
  function initMediaAudio() {
    if (mediaAudio) return;
    try {
      const make = (key, volume = .95, loop = false) => {
        const a = new Audio(AUDIO_FILES[key]);
        a.preload = 'auto';
        a.loop = loop;
        a.volume = clamp(volume, 0, 1);
        a.dataset.fallbackTried = '0';
        a.addEventListener('error', () => {
          if (a.dataset.fallbackTried === '1') return;
          const fallback = AUDIO_FALLBACK_URLS[key];
          if (!fallback) return;
          a.dataset.fallbackTried = '1';
          a.src = fallback;
          a.load();
        });
        return a;
      };
      const intro = make('intro', .90, false);
      const loop = make('loop', .80, true);
      mediaAudio = {
        intro,
        loop,
        introDone: false,
        sfx: {
          combo1: make('combo1', .98, false),
          combo2: make('combo2', 1.00, false),
          combo3: make('combo3', 1.00, false),
          combo4: make('combo4', 1.00, false),
          gameover: make('gameover', 1.00, false),
          score: make('score', .95, false),
          cutin: make('cutin', .95, false),
        }
      };
      intro.addEventListener('ended', () => {
        if (!mediaAudio) return;
        mediaAudio.introDone = true;
        if (!muted && gameState === State.PLAY) {
          mediaAudio.loop.currentTime = 0;
          mediaAudio.loop.play().catch(() => {});
        }
      });
    } catch (e) {
      console.warn('Audio file setup failed', e);
      mediaAudio = null;
    }
  }

  function startBgm() {
    if (muted) return;
    initMediaAudio();
    if (!mediaAudio) return;
    try {
      mediaAudio.introDone = false;
      mediaAudio.loop.pause();
      mediaAudio.loop.currentTime = 0;
      mediaAudio.intro.pause();
      mediaAudio.intro.currentTime = 0;
      mediaAudio.intro.play().catch(() => {});
    } catch (e) {}
  }

  function pauseBgm() {
    if (!mediaAudio) return;
    try {
      mediaAudio.intro.pause();
      mediaAudio.loop.pause();
    } catch (e) {}
  }

  function resumeBgm() {
    if (muted || gameState !== State.PLAY) return;
    initMediaAudio();
    if (!mediaAudio) return;
    try {
      if (!mediaAudio.introDone && mediaAudio.intro.currentTime > 0 && !mediaAudio.intro.ended) {
        mediaAudio.intro.play().catch(() => {});
      } else {
        mediaAudio.loop.play().catch(() => {});
      }
    } catch (e) {}
  }

  function stopBgm() {
    if (!mediaAudio) return;
    try {
      mediaAudio.intro.pause();
      mediaAudio.loop.pause();
      mediaAudio.intro.currentTime = 0;
      mediaAudio.loop.currentTime = 0;
    } catch (e) {}
  }

  function playFileSfx(key, volumeScale = 1) {
    if (muted) return;
    initMediaAudio();
    if (!mediaAudio || !mediaAudio.sfx || !mediaAudio.sfx[key]) return;
    try {
      const base = mediaAudio.sfx[key];
      // gameover/score はiPhoneでcloneNode再生が失敗することがあるため、元Audioを直接鳴らす。
      if (key === 'gameover' || key === 'score') {
        base.pause();
        base.currentTime = 0;
        base.volume = clamp((base.volume || 1) * volumeScale, 0, 1);
        base.play().catch(() => {
          const fallback = AUDIO_FALLBACK_URLS[key];
          if (fallback && base.src !== fallback) {
            base.src = fallback;
            base.load();
            base.play().catch(() => {});
          }
        });
        return;
      }
      const a = base.cloneNode(true);
      a.volume = clamp((base.volume || .95) * volumeScale, 0, 1);
      a.play().catch(() => {
        const fallback = AUDIO_FALLBACK_URLS[key];
        if (!fallback) return;
        try {
          const b = new Audio(fallback);
          b.volume = a.volume;
          b.play().catch(() => {});
        } catch (_) {}
      });
    } catch (e) {}
  }

  function playComboSfx(n) {
    if (n <= 1) playFileSfx('combo1');
    else if (n === 2) playFileSfx('combo2');
    else if (n === 3) playFileSfx('combo3');
    else playFileSfx('combo4');
  }


  function playTone(name, intensity = 1) {
    if (!audio || muted) return;
    const { ac, master } = audio;
    if (ac.state === 'suspended') ac.resume();
    const now = ac.currentTime;
    const gain = ac.createGain();
    gain.connect(master);
    gain.gain.setValueAtTime(.0001, now);

    let freqs = [440], dur = .08, type = 'sine', vol = 1;
    if (name === 'swap') { freqs = [520, 660]; dur = .045; type = 'triangle'; vol = .38; }
    if (name === 'ignite') { freqs = [360, 520, 780]; dur = .075; type = 'sawtooth'; vol = .55; }
    if (name === 'air') { freqs = [760, 960, 1280, 1580]; dur = .055; type = 'square'; vol = .48; }
    if (name === 'launch') { freqs = [170, 230, 320, 510]; dur = .13; type = 'sawtooth'; vol = .75; }
    if (name === 'fever') { freqs = [360, 540, 720, 960, 1320]; dur = .09; type = 'sine'; vol = .9; }
    if (name === 'bad') { freqs = [170, 130]; dur = .09; type = 'sawtooth'; vol = .34; }
    if (name === 'over') { freqs = [620, 500, 380, 250]; dur = .16; type = 'triangle'; vol = .55; }

    gain.gain.linearRampToValueAtTime(.42 * vol * intensity, now + .01);
    gain.gain.exponentialRampToValueAtTime(.0001, now + dur * freqs.length + .12);
    freqs.forEach((f, i) => {
      const osc = ac.createOscillator();
      osc.type = type;
      osc.frequency.setValueAtTime(f, now + i * dur);
      if (name === 'launch') osc.frequency.exponentialRampToValueAtTime(f * 1.9, now + i * dur + dur * .85);
      osc.connect(gain);
      osc.start(now + i * dur);
      osc.stop(now + i * dur + dur + .04);
    });
  }

  function vibrate(ms = 14) {
    if (rumbleCooldown > 0) return;
    rumbleCooldown = .06;
    if (navigator.vibrate) navigator.vibrate(ms);
  }

  function addScore(points) {
    score += Math.max(0, Math.round(points));
  }

  function addFloatText(x, y, text, size = 18, color = '#fff', life = .76) {
    floatTexts.push({ x, y, vx: rand(24, -24), vy: -72 - rand(28), text, size, color, life, maxLife: life, rot: rand(.18, -.18) });
  }

  function addParticle(x, y, color = '#fff', count = 8, power = 120, kind = 'dot') {
    for (let i = 0; i < count; i++) {
      const a = rand(Math.PI * 2, 0);
      const s = rand(power, power * .18);
      const life = rand(.68, .28);
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - rand(45),
        life, maxLife: life,
        size: rand(5, 2), color, kind,
        spin: rand(6, -6), rot: rand(Math.PI * 2, 0)
      });
    }
  }

  function addShockwave(x, y, radius = 80, color = 'rgba(255,255,255,.75)', life = .4) {
    shockwaves.push({ x, y, radius, color, life, maxLife: life });
  }

  function addSparkLine(x1, y1, x2, y2, color = '#fff58c', life = .22) {
    sparkLines.push({ x1, y1, x2, y2, color, life, maxLife: life });
  }

  function showCutin(title, subtitle, color = '#fff58c', kind = 'sun', duration = 1.02, freeze = true) {
    cutins = cutins.filter(c => c.life > .18);
    cutins.push({ title, subtitle, color, kind, life: duration, maxLife: duration });
    playFileSfx('cutin', kind === 'lion' ? .95 : .78);
    if (freeze && gameState === State.PLAY) cutinFreeze = Math.max(cutinFreeze, .48);
  }

  function showMiniNotice(title, color = '#fff') {
    cutins.push({ title, subtitle: '', color, kind: 'mini', life: .62, maxLife: .62 });
  }

  function insideBoard(x, y) {
    return x >= BOARD_X && x < BOARD_X + BOARD_W && y >= BOARD_Y && y < BOARD_Y + BOARD_H;
  }
  function cellFromPoint(x, y) {
    if (!insideBoard(x, y)) return null;
    const c = Math.floor((x - BOARD_X) / CELL);
    const r = Math.floor((y - BOARD_Y) / CELL);
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return null;
    return { r, c };
  }
  function cellFromPointWithOffset(x, y, offset) {
    return cellFromPoint(x, y - offset);
  }

  function getCanvasPoint(ev) {
    const rect = canvas.getBoundingClientRect();
    return { x: (ev.clientX - rect.left) * W / rect.width, y: (ev.clientY - rect.top) * H / rect.height };
  }

  function groupTileAt(g, r, c) {
    return g.tiles.find(t => t.row === r && t.col === c) || null;
  }

  function isFloatingAnchor(g, t) {
    if (!g || !t) return false;
    // The lowest block in each lifted column is the ignition/rocket base. It may match,
    // but the player cannot grab or swap it while airborne.
    return !g.tiles.some(o => o.col === t.col && o.row > t.row);
  }

  function hitTestFloating(x, y) {
    for (let gi = floatGroups.length - 1; gi >= 0; gi--) {
      const g = floatGroups[gi];
      for (let ti = g.tiles.length - 1; ti >= 0; ti--) {
        const t = g.tiles[ti];
        const px = gridToX(t.col);
        const py = gridToY(t.row) + g.offset;
        if (x >= px && x <= px + TILE && y >= py && y <= py + TILE) {
          return { layer: 'float', group: g, tile: t, r: t.row, c: t.col };
        }
      }
    }
    return null;
  }

  function hitTestTile(x, y) {
    const air = hitTestFloating(x, y);
    if (air) return air;
    const cell = cellFromPoint(x, y);
    if (!cell) return null;
    const t = ground[cell.r][cell.c];
    if (!t) return null;
    return { layer: 'ground', tile: t, r: cell.r, c: cell.c };
  }

  function keyOf(r, c) { return r + ':' + c; }
  function dragCellKey(layer, group, r, c) {
    return (layer === 'float' ? 'f' + group.id + ':' : 'g:') + r + ':' + c;
  }

  function onPointerDown(ev) {
    ev.preventDefault();
    initAudio();
    initMediaAudio();
    activePointerId = ev.pointerId;
    canvas.setPointerCapture?.(ev.pointerId);
    const p = getCanvasPoint(ev);
    pointer = { id: ev.pointerId, x: p.x, y: p.y, startX: p.x, startY: p.y, moved: false };

    if (gameState === State.TITLE) {
      if (pointInRect(p.x, p.y, 70, 572, 250, 66)) {
        resetGame();
        playTone('fever', .55);
      } else if (pointInRect(p.x, p.y, 94, 650, 202, 42)) {
        promptRegisterName();
      } else {
        addFloatText(W / 2, 612, 'STARTボタンを押してね', 14, '#fff', .5);
      }
      return;
    }
    if (gameState === State.OVER) {
      if (!gameOverScoreReady) return;
      if (pointInRect(p.x, p.y, 70, 486, 250, 52)) {
        promptAndSubmitScore();
        return;
      }
      if (pointInRect(p.x, p.y, 76, 744, 238, 54)) {
        resetGame();
        return;
      }
      return;
    }
    if (gameState !== State.PLAY) return;

    if (pointInCircle(p.x, p.y, 348, 66, 24)) {
      muted = !muted;
      if (!muted) {
        initAudio();
        resumeBgm();
      } else {
        pauseBgm();
      }
      addFloatText(348, 66, muted ? '音OFF' : '音ON', 15, '#fff', .45);
      return;
    }

    const hit = hitTestTile(p.x, p.y);
    if (!hit) {
      selectedHint = null;
      return;
    }
    if (hit.layer === 'float' && isFloatingAnchor(hit.group, hit.tile)) {
      addFloatText(centerX(hit.c), centerY(hit.r) + hit.group.offset, '下の点火ブロックは動かせない!', 13, '#b9f4ff', .55);
      playTone('bad', .22);
      selectedHint = null;
      return;
    }
    drag = {
      layer: hit.layer,
      group: hit.group || null,
      tile: hit.tile,
      r: hit.r,
      c: hit.c,
      path: [{ r: hit.r, c: hit.c }],
      touched: new Set([dragCellKey(hit.layer, hit.group || null, hit.r, hit.c)]),
      moved: false,
    };
    selectedHint = { layer: hit.layer, group: hit.group || null, r: hit.r, c: hit.c };
    hit.tile.targetScale = 1.1;
    hit.tile.flash = .12;
    playTone('swap', .25);
  }

  function onPointerMove(ev) {
    if (!pointer || ev.pointerId !== activePointerId || gameState !== State.PLAY || !drag) return;
    ev.preventDefault();
    const p = getCanvasPoint(ev);
    pointer.x = p.x; pointer.y = p.y;
    if (Math.hypot(p.x - pointer.startX, p.y - pointer.startY) > 10) pointer.moved = true;

    if (drag.layer === 'ground') {
      const cell = cellFromPoint(p.x, p.y);
      if (!cell) return;
      maybeMoveGroundDrag(cell.r, cell.c);
    } else if (drag.layer === 'float' && drag.group && floatGroups.includes(drag.group)) {
      const cell = cellFromPointWithOffset(p.x, p.y, drag.group.offset);
      if (!cell) return;
      maybeMoveFloatDrag(cell.r, cell.c);
    }
  }

  function maybeMoveGroundDrag(r, c) {
    if (!drag || drag.layer !== 'ground') return;
    if (r === drag.r && c === drag.c) return;
    const dist = Math.abs(r - drag.r) + Math.abs(c - drag.c);
    if (dist !== 1) return;
    const a = drag.tile;
    const b = ground[r]?.[c];
    if (!a || !b) { playTone('bad', .18); return; }
    ground[drag.r][drag.c] = b;
    ground[r][c] = a;
    b.row = drag.r; b.col = drag.c; b.tx = gridToX(b.col); b.ty = gridToY(b.row); b.targetScale = 1.04;
    a.row = r; a.col = c; a.tx = gridToX(c); a.ty = gridToY(r); a.targetScale = 1.08;
    addSparkLine(centerX(drag.c), centerY(drag.r), centerX(c), centerY(r), '#fff', .13);
    drag.r = r; drag.c = c; drag.moved = true;
    drag.path.push({ r, c });
    drag.touched.add(dragCellKey('ground', null, r, c));
    selectedHint = { layer: 'ground', r, c };
    playTone('swap', .32);
  }

  function maybeMoveFloatDrag(r, c) {
    if (!drag || drag.layer !== 'float' || !drag.group) return;
    const g = drag.group;
    if (r === drag.r && c === drag.c) return;
    const dist = Math.abs(r - drag.r) + Math.abs(c - drag.c);
    if (dist !== 1) return;
    const a = drag.tile;
    const b = groupTileAt(g, r, c);
    if (!a || !b) { playTone('bad', .18); return; }
    if (isFloatingAnchor(g, a) || isFloatingAnchor(g, b)) {
      addFloatText(centerX(c), centerY(r) + g.offset, 'そこは固定!', 12, '#b9f4ff', .35);
      playTone('bad', .18);
      return;
    }
    const oldR = drag.r, oldC = drag.c;
    b.row = oldR; b.col = oldC;
    a.row = r; a.col = c;
    updateGroupTileTargets(g);
    a.targetScale = 1.1; b.targetScale = 1.04;
    a.flash = .10; b.flash = .08;
    addSparkLine(centerX(oldC), centerY(oldR) + g.offset, centerX(c), centerY(r) + g.offset, '#b9f4ff', .14);
    drag.r = r; drag.c = c; drag.moved = true;
    drag.path.push({ r, c });
    drag.touched.add(dragCellKey('float', g, r, c));
    selectedHint = { layer: 'float', group: g, r, c };
    playTone('swap', .38);
  }

  function onPointerUp(ev) {
    if (pointer && ev.pointerId === activePointerId) {
      ev.preventDefault();
      if (gameState === State.PLAY && drag && drag.moved) {
        resolveAfterMove(drag);
      }
    }
    activePointerId = null;
    pointer = null;
    drag = null;
  }

  function pointInRect(x, y, rx, ry, rw, rh) {
    return x >= rx && x <= rx + rw && y >= ry && y <= ry + rh;
  }

  function pointInCircle(x, y, cx, cy, r) {
    return Math.hypot(x - cx, y - cy) <= r;
  }

  function findGroundRuns(touched = null) {
    const runs = [];
    const addRun = (cells, type, dir) => {
      if (cells.length < 3 || type == null) return;
      if (touched && !cells.some(cell => touched.has(dragCellKey('ground', null, cell.r, cell.c)))) return;
      runs.push({ layer: 'ground', cells: cells.map(v => ({ ...v })), type, dir });
    };
    for (let r = 0; r < ROWS; r++) {
      let run = [], type = null;
      for (let c = 0; c < COLS; c++) {
        const t = ground[r][c];
        const k = tileMatchKey(t);
        if (t && k === type) run.push({ r, c });
        else { addRun(run, type, 'h'); run = t ? [{ r, c }] : []; type = t ? k : null; }
      }
      addRun(run, type, 'h');
    }
    for (let c = 0; c < COLS; c++) {
      let run = [], type = null;
      for (let r = 0; r < ROWS; r++) {
        const t = ground[r][c];
        const k = tileMatchKey(t);
        if (t && k === type) run.push({ r, c });
        else { addRun(run, type, 'v'); run = t ? [{ r, c }] : []; type = t ? k : null; }
      }
      addRun(run, type, 'v');
    }
    return dedupeRuns(runs);
  }

  function findGroupRuns(g, touched = null) {
    const map = new Map();
    for (const t of g.tiles) map.set(keyOf(t.row, t.col), t);
    const runs = [];
    const addRun = (cells, type, dir) => {
      if (cells.length < 3 || type == null) return;
      if (touched && !cells.some(cell => touched.has(dragCellKey('float', g, cell.r, cell.c)))) return;
      runs.push({ layer: 'float', group: g, cells: cells.map(v => ({ ...v })), type, dir });
    };
    for (let r = 0; r < ROWS; r++) {
      let run = [], type = null;
      for (let c = 0; c < COLS; c++) {
        const t = map.get(keyOf(r, c));
        const k = tileMatchKey(t);
        if (t && k === type) run.push({ r, c });
        else { addRun(run, type, 'h'); run = t ? [{ r, c }] : []; type = t ? k : null; }
      }
      addRun(run, type, 'h');
    }
    for (let c = 0; c < COLS; c++) {
      let run = [], type = null;
      for (let r = 0; r < ROWS; r++) {
        const t = map.get(keyOf(r, c));
        const k = tileMatchKey(t);
        if (t && k === type) run.push({ r, c });
        else { addRun(run, type, 'v'); run = t ? [{ r, c }] : []; type = t ? k : null; }
      }
      addRun(run, type, 'v');
    }
    return dedupeRuns(runs);
  }

  function dedupeRuns(runs) {
    const out = [];
    const seen = new Set();
    for (const r of runs) {
      const k = r.layer + ':' + (r.group?.id || 0) + ':' + r.dir + ':' + r.type + ':' + r.cells.map(c => keyOf(c.r, c.c)).join('|');
      if (!seen.has(k)) { seen.add(k); out.push(r); }
    }
    return out;
  }


  function mergeRunsToClusters(runs) {
    const byType = new Map();
    for (const run of runs) {
      if (!byType.has(run.type)) byType.set(run.type, new Map());
      const cells = byType.get(run.type);
      for (const cell of run.cells) cells.set(keyOf(cell.r, cell.c), { ...cell });
    }
    const clusters = [];
    for (const [type, cells] of byType) {
      const remaining = new Set(cells.keys());
      while (remaining.size) {
        const start = remaining.values().next().value;
        const stack = [start];
        const component = [];
        remaining.delete(start);
        while (stack.length) {
          const k = stack.pop();
          const cell = cells.get(k);
          component.push(cell);
          const nbs = [[cell.r + 1, cell.c], [cell.r - 1, cell.c], [cell.r, cell.c + 1], [cell.r, cell.c - 1]];
          for (const [nr, nc] of nbs) {
            const nk = keyOf(nr, nc);
            if (remaining.has(nk)) {
              remaining.delete(nk);
              stack.push(nk);
            }
          }
        }
        clusters.push({ layer: runs[0]?.layer || 'ground', group: runs[0]?.group || null, cells: component, type, dir: 'cluster' });
      }
    }
    return clusters.sort((a, b) => b.cells.length - a.cells.length);
  }

  function resolveAfterMove(d) {
    if (!d) return;
    let acted = false;
    if (d.layer === 'float' && d.group && floatGroups.includes(d.group)) {
      const runs = findGroupRuns(d.group, d.touched);
      if (runs.some(run => run.type === 'lion')) {
        triggerLionSpecial(runs, d.group);
        acted = true;
      } else if (runs.length) {
        launchFloatGroup(d.group, runs, 'air');
        acted = true;
      }
    }
    if (d.layer === 'ground') {
      const runs = findGroundRuns(d.touched);
      if (runs.some(run => run.type === 'lion')) {
        triggerLionSpecial(runs, null);
        acted = true;
      } else if (runs.length) {
        igniteGroundRuns(runs);
        acted = true;
      }
    }
    if (!acted) {
      addFloatText(d.layer === 'float' && d.group ? centerX(d.c) : centerX(d.c), (d.layer === 'float' && d.group ? centerY(d.r) + d.group.offset : centerY(d.r)), d.layer === 'float' ? '空中で3つ!' : '3つそろえて点火!', 14, 'rgba(255,255,255,.88)', .55);
      playTone('bad', .25);
    }
  }

  function igniteGroundRuns(runs) {
    const used = new Set();
    let ignited = 0;
    const clusters = mergeRunsToClusters(runs.filter(run => run.type !== 'lion'));
    for (const run of clusters) {
      const matchCount = run.cells.length;
      const baseLimit = matchCount * 2 + 1;
      const cellsToLift = [];
      for (const cell of run.cells) {
        for (let r = cell.r; r >= 0; r--) {
          const t = ground[r][cell.c];
          if (!t) continue;
          // スペシャルは通常点火では持ち上げない。
          // ただし、その上の通常ブロックは持ち上げて、あとで重力に従って1マス分詰める。
          if (isLionTile(t)) continue;
          if (!used.has(t.id)) {
            used.add(t.id);
            cellsToLift.push(t);
          }
        }
      }
      if (cellsToLift.length < 3) continue;
      for (const t of cellsToLift) ground[t.row][t.col] = null;
      compactLiftedTilesByColumn(cellsToLift);

      const payload = cellsToLift.length;
      const rideCount = Math.max(0, payload - matchCount);
      const quickLaunch = rideCount <= baseLimit;

      const tier = quickLaunch ? 'quick' : rideCount <= 12 ? 'stock' : rideCount <= 19 ? 'big' : 'huge';
      const heavy = tier === 'big' || tier === 'huge';
      const medium = tier === 'stock';
      const lift = quickLaunch
        ? 42
        : tier === 'stock'
          ? clamp(132 - rideCount * 1.15 + (fever > 0 ? 30 : 0), 92, 142)
          : tier === 'big'
            ? clamp(136 - rideCount * 1.15 + (fever > 0 ? 32 : 0), 90, 146)
            : clamp(142 - rideCount * .95 + (fever > 0 ? 34 : 0), 88, 154);
      const gravity = quickLaunch
        ? 36
        : tier === 'stock'
          ? (18 + rideCount * 1.2 + elapsedSeconds() * .35) * (fever > 0 ? .46 : 1)
          : tier === 'big'
            ? (18 + rideCount * 1.28 + elapsedSeconds() * .34) * (fever > 0 ? .46 : 1)
            : (20 + rideCount * 1.42 + elapsedSeconds() * .34) * (fever > 0 ? .48 : 1);
      const startVy = quickLaunch
        ? -92
        : tier === 'stock'
          ? -clamp(180 - rideCount * 1.65, 128, 196) - (fever > 0 ? 20 : 0)
          : tier === 'big'
            ? -clamp(172 - rideCount * 1.45, 124, 188) - (fever > 0 ? 18 : 0)
            : -clamp(166 - rideCount * 1.15, 118, 180) - (fever > 0 ? 16 : 0);
      const hoverTime = quickLaunch
        ? .14
        : tier === 'stock'
          ? clamp(fever > 0 ? 3.15 : 2.55, fever > 0 ? 3.0 : 2.40, fever > 0 ? 3.35 : 2.75)
          : tier === 'big'
            ? clamp(fever > 0 ? 2.82 : 2.25, fever > 0 ? 2.65 : 2.05, fever > 0 ? 3.05 : 2.42)
            : clamp(fever > 0 ? 2.55 : 2.02, fever > 0 ? 2.35 : 1.82, fever > 0 ? 2.82 : 2.18);
      const g = {
        id: groupId++, tiles: cellsToLift,
        offset: 0, vy: startVy, gravity,
        lift, age: 0, born: performance.now(),
        hoverTime,
        payload, mass: payload, weight: rideCount, runLength: matchCount,
        tier, quickLaunch,
        ignitesNeeded: tier === 'huge' ? 2 : 1,
        ignitesDone: 0,
        heavy, medium,
        color: tileColorByType(run.type),
        label: quickLaunch ? '即発射' : tier === 'stock' ? 'ため発射' : tier === 'big' ? '大ため' : '超ため',
        launched: false,
        hot: 1,
        slowFall: 0,
        topReached: false,
        warning: 0,
      };
      updateGroupTileTargets(g, true);
      floatGroups.push(g);
      ignited++;
      totalIgnited++;
      if (!quickLaunch) {
        const tMultIgnite = registerTempoCombo(true, chainDuration('air'));
        addFloatText(groupCenter(g).x, groupCenter(g).y - 48, `${combo} COMBO 点火! ×${tMultIgnite.toFixed(2)}`, 16, '#b9f4ff', .78);
      }
      const center = groupCenter(g);
      const mult = weightMultiplier(rideCount);
      const quickMsg = '軽い! 即発射!';
      addFloatText(center.x, center.y - 22, quickLaunch ? quickMsg : `${g.label}点火!`, heavy ? 22 : 19, heavy ? '#ffb0b4' : '#fff58c', .82);
      addFloatText(center.x, center.y + 6, quickLaunch ? `つなぎ${matchCount} / 乗り数${rideCount}  すぐ飛ぶ!` : `つなぎ${matchCount} / 乗り数${rideCount}  重さ×${mult.toFixed(1)}${g.ignitesNeeded > 1 ? '  2点火で超発射!' : '  空中3つで大発射!'}`, 14, '#ffffff', .9);
      addShockwave(center.x, center.y, 85 + payload * 2.8, heavy ? 'rgba(255,109,121,.82)' : 'rgba(255,245,140,.80)', .36);
      addParticle(center.x, center.y, tileColorByType(run.type), 12 + Math.min(20, payload), 170, 'spark');
      addScore(18 * matchCount);
      danger = clamp(danger + (quickLaunch ? .4 : heavy ? 5 : medium ? 3 : 1), 0, 100);
      if (quickLaunch) {
        launchFloatGroup(g, [{ type: run.type, cells: run.cells }], 'quick');
      }
    }
    packGroundColumns();
    if (ignited) {
      playTone('ignite', clamp(.65 + ignited * .12, .65, 1.1));
      vibrate(12 + ignited * 4);
      shake += .12 + ignited * .04;
    }
  }

  function updateGroupTileTargets(g, instant = false) {
    for (const t of g.tiles) {
      t.tx = gridToX(t.col);
      t.ty = gridToY(t.row) + g.offset;
      if (instant) { t.x = t.tx; t.y = t.ty; }
    }
  }

  function groupCenter(g) {
    if (!g.tiles.length) return { x: W / 2, y: BOARD_Y + BOARD_H / 2 };
    let x = 0, y = 0;
    for (const t of g.tiles) { x += centerX(t.col); y += centerY(t.row) + g.offset; }
    return { x: x / g.tiles.length, y: y / g.tiles.length };
  }

  function groupBounds(g) {
    let minC = COLS, maxC = -1, minR = ROWS, maxR = -1;
    for (const t of g.tiles) { minC = Math.min(minC, t.col); maxC = Math.max(maxC, t.col); minR = Math.min(minR, t.row); maxR = Math.max(maxR, t.row); }
    return {
      x: gridToX(minC) - 4, y: gridToY(minR) + g.offset - 4,
      w: (maxC - minC + 1) * CELL + 4, h: (maxR - minR + 1) * CELL + 4,
      minR, maxR, minC, maxC
    };
  }

  function weightMultiplier(weight) {
    if (weight <= 7) return 1;
    if (weight <= 12) return 1.65 + (weight - 8) * 0.06;
    if (weight <= 19) return 2.15 + (weight - 13) * 0.08;
    return Math.min(4.0, 2.9 + (weight - 20) * 0.09);
  }

  function tempoMultiplier(n) {
    if (n <= 1) return 1;
    if (n <= 20) return 1 + (n - 1) * .05;
    return 1 + 19 * .05 + (n - 20) * .02;
  }

  function chainDuration(kind = 'quick') {
    const bonus = fever > 0 ? .5 : 0;
    if (kind === 'quick') return 3.6 + bonus;
    if (kind === 'air') return 4.15 + bonus;
    if (kind === 'partial') return 4.65 + bonus;
    if (kind === 'huge') return 5.05 + bonus;
    if (kind === 'lion') return 5.1 + bonus;
    return 3.6 + bonus;
  }

  function registerTempoCombo(awardLion = true, holdSeconds = null) {
    combo = comboHold > 0 ? combo + 1 : 1;
    comboHoldMax = Math.max(.1, holdSeconds ?? chainDuration('quick'));
    comboHold = comboHoldMax;
    maxCombo = Math.max(maxCombo, combo);
    playComboSfx(combo);
    if (awardLion) awardLionBlockForCombo(combo);
    return tempoMultiplier(combo);
  }

  function countLionBlocks() {
    let count = 0;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (isLionTile(ground[r][c])) count++;
    for (const t of falling) if (isLionTile(t)) count++;
    for (const g of floatGroups) for (const t of g.tiles) if (isLionTile(t)) count++;
    return count;
  }

  function awardLionBlockForCombo(currentCombo) {
    if (currentCombo <= 0 || currentCombo % 5 !== 0 || currentCombo <= lastLionAwardCombo) return;
    lastLionAwardCombo = currentCombo;
    const added = spawnLionBlock();
    showCutin('さんさんライオン!', `${currentCombo} COMBO ライオンブロックGET!`, '#ffe17a', 'lion', .72, false);
    if (!added) addFloatText(W / 2, BOARD_Y - 18, '特殊ブロックをそろえてがおー!', 16, '#ffe17a', .9);
    playTone('combo', .78);
    vibrate(22);
  }

  function spawnLionBlock() {
    if (countLionBlocks() >= 5) return false;
    const cols = [...Array(COLS).keys()].sort(() => Math.random() - .5);
    for (const c of cols) {
      if (columnHasFalling(c)) continue;
      const target = lowestEmptyRow(c);
      if (target < 0) continue;
      const t = makeLionTile();
      t.col = c; t.row = -1;
      t.x = gridToX(c); t.y = BOARD_Y - CELL - rand(36, 8);
      t.tx = gridToX(c); t.ty = gridToY(target);
      t.vy = 170 + rand(45);
      t.scale = .9; t.targetScale = 1;
      falling.push(t);
      addFloatText(centerX(c), BOARD_Y - 8, 'ライオンGET!', 15, '#ffe17a', .72);
      return true;
    }
    const candidates = [];
    for (let r = ROWS - 1; r >= 0; r--) {
      for (let c = 0; c < COLS; c++) if (ground[r][c] && !isLionTile(ground[r][c])) candidates.push({ r, c });
    }
    if (!candidates.length) return false;
    const spot = candidates[Math.floor(Math.random() * candidates.length)];
    const t = makeLionTile();
    placeGround(t, spot.r, spot.c, true);
    addParticle(centerX(spot.c), centerY(spot.r), '#ffe17a', 14, 180, 'spark');
    addFloatText(centerX(spot.c), centerY(spot.r), 'ライオンGET!', 15, '#ffe17a', .72);
    return true;
  }

  function collectAllTilesForBlast() {
    const tiles = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = ground[r][c];
        if (!t) continue;
        ground[r][c] = null;
        tiles.push({ tile: t, x: t.x, y: t.y });
      }
    }
    for (const g of floatGroups) {
      updateGroupTileTargets(g);
      for (const t of g.tiles) tiles.push({ tile: t, x: t.x, y: t.y });
    }
    floatGroups = [];
    for (const t of falling) tiles.push({ tile: t, x: t.x, y: t.y });
    falling = [];
    return tiles;
  }

  function lionMatchCellsFromRuns(runs) {
    const map = new Map();
    for (const run of runs) {
      if (run.type !== 'lion') continue;
      for (const cell of run.cells) map.set(keyOf(cell.r, cell.c), { ...cell });
    }
    return [...map.values()];
  }

  function blastGroundCells(cellList, center, color = '#ffe17a') {
    const tiles = [];
    const seen = new Set();
    for (const cell of cellList) {
      if (cell.r < 0 || cell.r >= ROWS || cell.c < 0 || cell.c >= COLS) continue;
      const k = keyOf(cell.r, cell.c);
      if (seen.has(k)) continue;
      seen.add(k);
      const t = ground[cell.r]?.[cell.c];
      if (!t) continue;
      ground[cell.r][cell.c] = null;
      tiles.push({ tile: t, x: t.x, y: t.y });
    }
    if (tiles.length) {
      launchers.push({
        tiles: tiles.map(({ tile, x, y }) => {
          const a = Math.atan2(y - center.y, x - center.x) + rand(.7, -.7);
          const p = 220 + rand(170);
          return { tile, x, y, vx: Math.cos(a) * p, vy: -620 - rand(280), rot: tile.rot, spin: rand(10, -10) };
        }),
        age: 0, color, fever: true, mass: tiles.length
      });
    }
    packGroundColumns();
    return tiles.length;
  }

  function compactFloatGroupColumns(g) {
    if (!g || !g.tiles || !g.tiles.length) return;
    const maxRowByCol = new Map();
    for (const t of g.tiles) {
      maxRowByCol.set(t.col, Math.max(maxRowByCol.get(t.col) ?? -1, t.row));
    }
    for (const [col, maxR] of maxRowByCol) {
      const colTiles = g.tiles
        .filter(t => t.col === col)
        .sort((a, b) => b.row - a.row);
      let r = maxR;
      for (const t of colTiles) {
        t.row = r--;
      }
    }
    updateGroupTileTargets(g);
  }

  function blastFloatingGroupCells(g, cellList, center, color = '#ffe17a') {
    if (!g || !floatGroups.includes(g)) return 0;
    const removeKeys = new Set();
    for (const cell of cellList) {
      if (cell.r < 0 || cell.r >= ROWS || cell.c < 0 || cell.c >= COLS) continue;
      removeKeys.add(keyOf(cell.r, cell.c));
    }
    if (!removeKeys.size) return 0;
    updateGroupTileTargets(g);
    const blasted = [];
    const remain = [];
    for (const t of g.tiles) {
      if (removeKeys.has(keyOf(t.row, t.col))) blasted.push({ tile: t, x: t.x, y: t.y });
      else remain.push(t);
    }
    if (!blasted.length) return 0;
    g.tiles = remain;
    if (blasted.length) {
      launchers.push({
        tiles: blasted.map(({ tile, x, y }) => {
          const a = Math.atan2(y - center.y, x - center.x) + rand(.7, -.7);
          const p = 220 + rand(170);
          return { tile, x, y, vx: Math.cos(a) * p, vy: -620 - rand(280), rot: tile.rot, spin: rand(10, -10) };
        }),
        age: 0, color, fever: true, mass: blasted.length
      });
    }
    if (!g.tiles.length) {
      floatGroups = floatGroups.filter(x => x !== g);
    } else {
      compactFloatGroupColumns(g);
      g.hot = Math.max(g.hot || 0, .9);
    }
    return blasted.length;
  }

  function triggerLionSpecial(runs = [], group = null) {
    const lionCells = lionMatchCellsFromRuns(runs);
    const matchCount = Math.max(3, lionCells.length);
    const center = group ? groupCenter(group) : matchCenterFromRuns(runs);
    const tMult = registerTempoCombo(false, chainDuration('lion'));

    if (matchCount >= 5) {
      const tiles = collectAllTilesForBlast();
      const finalScore = Math.round((tiles.length * 280 + 5200) * tMult * (fever > 0 ? 1.8 : 1));
      addScore(finalScore);
      totalLaunched += tiles.length;
      danger = clamp(danger - 70, 0, 100);
      showCutin('さんさんライオン!', 'がおー! 全消し!', '#ffe17a', 'lion', 1.20, true);
      if (tiles.length) {
        launchers.push({
          tiles: tiles.map(({ tile, x, y }) => {
            const a = Math.atan2(y - center.y, x - center.x) + rand(.7, -.7);
            const p = 280 + rand(220);
            return { tile, x, y, vx: Math.cos(a) * p, vy: -800 - rand(390), rot: tile.rot, spin: rand(11, -11) };
          }),
          age: 0, color: '#ffe17a', fever: true, mass: tiles.length
        });
      }
      addFloatText(W / 2, BOARD_Y + BOARD_H * .36, `全消し! +${finalScore}`, 30, '#ffe17a', 1.25);
      addShockwave(W / 2, BOARD_Y + BOARD_H * .45, 330, 'rgba(255,225,122,.94)', .80);
      for (let i = 0; i < 82; i++) addParticle(W / 2 + rand(170, -170), BOARD_Y + BOARD_H * .45 + rand(130, -130), '#ffe17a', 1, 340, 'spark');
      flash = Math.max(flash, .60); shake += 1.55; playTone('fever', 1.25); vibrate(64);
      return;
    }

    let cells = [];
    if (matchCount >= 4) {
      const rows = new Set(lionCells.map(c => c.r));
      const cols = new Set(lionCells.map(c => c.c));
      for (const r of rows) for (let c = 0; c < COLS; c++) cells.push({ r, c });
      for (const c of cols) for (let r = 0; r < ROWS; r++) cells.push({ r, c });
    } else {
      for (const cell of lionCells) {
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) cells.push({ r: cell.r + dr, c: cell.c + dc });
      }
    }
    const blastedGround = blastGroundCells(cells, center, '#ffe17a');
    const blastedFloat = group ? blastFloatingGroupCells(group, cells, center, '#ffe17a') : 0;
    const blasted = blastedGround + blastedFloat;
    const finalScore = Math.round((blasted * (matchCount >= 4 ? 190 : 125) + matchCount * 650) * tMult * (fever > 0 ? 1.5 : 1));
    addScore(finalScore);
    totalLaunched += blasted;
    danger = clamp(danger - (matchCount >= 4 ? 32 : 20), 0, 100);
    showCutin('さんさんライオン!', matchCount >= 4 ? '大がおー! 十字破壊!' : 'がおー! 周囲破壊!', '#ffe17a', 'lion', matchCount >= 4 ? .98 : .82, false);
    addFloatText(center.x, center.y - 26, `${matchCount}個消し! +${finalScore}`, 24, '#ffe17a', 1.0);
    addShockwave(center.x, center.y, matchCount >= 4 ? 230 : 150, 'rgba(255,225,122,.88)', .56);
    for (let i = 0; i < (matchCount >= 4 ? 44 : 26); i++) addParticle(center.x + rand(70, -70), center.y + rand(60, -60), '#ffe17a', 1, matchCount >= 4 ? 260 : 210, 'spark');
    flash = Math.max(flash, matchCount >= 4 ? .34 : .22);
    shake += matchCount >= 4 ? .90 : .55;
    playTone(matchCount >= 4 ? 'fever' : 'combo', .95);
    vibrate(matchCount >= 4 ? 46 : 30);
  }

  function matchCenterFromRuns(runs) {
    const cells = [];
    for (const run of runs) for (const cell of run.cells) cells.push(cell);
    if (!cells.length) return { x: W / 2, y: BOARD_Y + BOARD_H / 2 };
    let x = 0, y = 0;
    for (const cell of cells) { x += centerX(cell.c); y += centerY(cell.r); }
    return { x: x / cells.length, y: y / cells.length };
  }

  function riskMultiplier() {
    const top = topPressure();
    const floatMass = floatGroups.reduce((s, g) => s + (g.offset > -30 ? (g.weight || 0) * .022 : (g.weight || 0) * .009), 0);
    return clamp(1 + danger * .012 + top * .55 + floatMass, 1, 4.2);
  }

  function launchFloatGroup(g, runs, reason = 'air') {
    if (!floatGroups.includes(g) || g.launched) return;
    const isQuick = reason === 'quick';
    const matchedCells = new Set();
    let longest = 0;
    for (const run of runs) {
      longest = Math.max(longest, run.cells.length);
      for (const cell of run.cells) matchedCells.add(keyOf(cell.r, cell.c));
    }
    const center = groupCenter(g);
    const payload = g.payload ?? g.mass;
    const weight = g.weight ?? 0;
    const matchCount = Math.max(longest, matchedCells.size || g.runLength || 3);

    if (!isQuick && (g.ignitesNeeded || 1) > 1 && (g.ignitesDone || 0) < (g.ignitesNeeded - 1)) {
      g.ignitesDone = (g.ignitesDone || 0) + 1;
      g.vy = Math.min(g.vy, -178);
      g.offset = Math.min(g.offset, -Math.max(48, g.lift * .70));
      g.hoverTime = Math.max(g.hoverTime, fever > 0 ? 1.45 : 1.05);
      g.slowFall = Math.max(g.slowFall || 0, fever > 0 ? 1.45 : 1.20);
      g.topReached = false;
      g.hot = 1.55;
      danger = clamp(danger - 8, 0, 100);
      const tMult = registerTempoCombo(true, chainDuration('partial'));
      const partial = Math.round((payload * 22 + weight * 65 + matchCount * 90) * tMult * (fever > 0 ? 1.7 : 1));
      addScore(partial);
      if (fever <= 0) {
        sunGauge = clamp(sunGauge + 8 + weight * .75 + matchCount * 1.2, 0, 100);
        if (sunGauge >= 100) triggerFever();
      }
      addFloatText(center.x, center.y - 24, `追い点火 ${g.ignitesDone}/${g.ignitesNeeded}! +${partial}`, 21, '#fff58c', .95);
      addFloatText(center.x, center.y + 6, 'もう1回空中でそろえて超発射!', 14, '#b9f4ff', .85);
      addShockwave(center.x, center.y, 110 + Math.min(90, payload * 3), 'rgba(255,245,140,.82)', .42);
      addParticle(center.x, center.y, '#fff58c', 18 + Math.min(28, payload), 210, 'spark');
      playTone('air', .9);
      vibrate(24);
      return;
    }

    g.launched = true;
    const chainKind = isQuick ? 'quick' : ((g.ignitesNeeded || 1) > 1 ? 'huge' : 'air');
    const tMult = registerTempoCombo(true, chainDuration(chainKind));
    if (!isQuick) totalAerial++;
    const base = payload * (isQuick ? 54 : 72) + matchedCells.size * (isQuick ? 88 : 145) + Math.max(0, longest - 3) * (isQuick ? 90 : 160) + weight * (isQuick ? 30 : 110);
    const wMult = weightMultiplier(weight);
    const giriMult = isQuick ? 1 : (g.offset > -26 ? 1.55 : 1);
    const feverMult = fever > 0 ? 2.2 : 1;
    const styleMult = isQuick ? .82 : 1;
    const hugeMult = (!isQuick && (g.ignitesNeeded || 1) > 1) ? 1.35 : 1;
    const finalScore = Math.round(base * wMult * giriMult * feverMult * styleMult * tMult * hugeMult);
    addScore(finalScore);
    totalLaunched += payload;
    if (!isQuick && fever <= 0) {
      sunGauge = clamp(sunGauge + 14 + payload * 1.25 + weight * .9 + combo * .8 + (giriMult > 1 ? 8 : 0), 0, 100);
      if (sunGauge >= 100) triggerFever();
    }

    floatGroups = floatGroups.filter(x => x !== g);
    launchers.push({
      tiles: g.tiles.map(t => ({ tile: t, x: t.x, y: t.y, vx: rand(70, -70), vy: -760 - payload * 11 - rand(110), rot: t.rot, spin: rand(7, -7) })),
      age: 0, color: g.color, fever: fever > 0, mass: payload
    });

    const txt = isQuick ? `${combo} COMBO 即発射! +${finalScore}` : (g.ignitesNeeded || 1) > 1 ? `${combo} COMBO 三段超発射! +${finalScore}` : `${combo} COMBO 空中大発射! +${finalScore}`;
    addFloatText(center.x, center.y - 36, txt, combo > 4 ? 24 : 22, fever > 0 ? '#fff58c' : '#ffffff', 1.0);
    addFloatText(center.x, center.y - 4, isQuick ? `つなぎ${matchCount} / 乗り数${weight}  COMBO×${tMult.toFixed(2)}` : `乗り数${weight}  重さ×${wMult.toFixed(1)}  COMBO×${tMult.toFixed(2)}${giriMult > 1 ? '  ギリギリ×1.5' : ''}${fever > 0 ? '  FEVER×2' : ''}`, 14, '#b9f4ff', 1.0);
    if (combo >= 5 || finalScore > 6000) showMiniNotice(combo >= 5 ? `${combo} COMBO ×${tMult.toFixed(2)}` : 'BIG SCORE!', '#fff58c');
    addShockwave(center.x, center.y, 130 + Math.min(120, payload * 5), fever > 0 ? 'rgba(255,246,120,.90)' : 'rgba(185,244,255,.88)', .56);
    addParticle(center.x, center.y, g.color, 20 + Math.min(34, payload), 260 + combo * 8, 'spark');
    shake += .38 + Math.min(.75, payload * .025) + (combo > 6 ? .22 : 0);
    flash = Math.max(flash, fever > 0 ? .22 : .12);
    danger = clamp(danger - (isQuick ? 7 : 12) - payload * .7 - combo * .35, 0, 100);
    if (danger > 76 && !isQuick) {
      showMiniNotice('ピンチブレイク!', '#ffb0b4');
      addFloatText(center.x, center.y + 28, '危険時発射で逆転!', 15, '#ffb0b4', .85);
    }
    playTone(!isQuick && combo >= 2 ? 'air' : 'launch', clamp(.7 + payload * .015 + combo * .015, .7, 1.25));
    setTimeout(() => playTone('launch', clamp(.7 + payload * .012, .7, 1.25)), 60);
    vibrate(Math.min(42, 16 + payload));
  }

  function triggerFever() {
    fever = FEVER_SECONDS;
    sunGauge = 0;
    flash = .42;
    shake += .7;
    for (const g of floatGroups) {
      g.gravity *= .55;
      g.vy -= 80;
      g.hot = Math.max(g.hot, 1.2);
    }
    showCutin('SUNNY FEVER!', 'ういてる時間UP! 発射スコアUP!', '#fff58c', 'sun', 1.12, true);
    addShockwave(W / 2, 130, 280, 'rgba(255,244,109,.9)', .72);
    for (let i = 0; i < 42; i++) addParticle(330, 82, '#fff58c', 1, 245, 'spark');
    playTone('fever', 1.15);
    vibrate(34);
  }

  function triggerLastRoar() {
    lastRoarReady = false;
    danger = 58;
    cutinFreeze = Math.max(cutinFreeze, .70);
    showCutin('さんさんライオン!', 'LAST ROAR! まだ落とさない!', '#ffe17a', 'lion', 1.16, true);
    for (const g of floatGroups) {
      g.vy = Math.min(g.vy, -260);
      g.offset = Math.min(g.offset, -56);
      g.gravity *= .72;
      g.hot = 1.4;
    }
    // Buy time but do not solve the puzzle: push away only the most dangerous top pieces.
    let removed = 0;
    for (let r = 0; r < 2; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = ground[r][c];
        if (t) {
          ground[r][c] = null;
          removed++;
          addParticle(centerX(c), centerY(r), tileColor(t), 8, 170, 'spark');
        }
      }
    }
    if (removed) {
      packGroundColumns();
      addFloatText(W / 2, BOARD_Y + 38, `押し返し! あと自力で飛ばせ!`, 19, '#ffe17a', 1.05);
      addScore(removed * 30);
    }
    addShockwave(W / 2, BOARD_Y + 74, 260, 'rgba(255,225,122,.85)', .68);
    shake += 1.1;
    flash = .34;
    playTone('fever', .95);
    vibrate(48);
  }

  function packGroundColumns() {
    for (let c = 0; c < COLS; c++) {
      const tiles = [];
      for (let r = ROWS - 1; r >= 0; r--) {
        if (ground[r][c]) tiles.push(ground[r][c]);
        ground[r][c] = null;
      }
      let r = ROWS - 1;
      for (const t of tiles) {
        placeGround(t, r, c, false);
        r--;
      }
    }
  }

  function lowestEmptyRow(c) {
    for (let r = ROWS - 1; r >= 0; r--) if (!ground[r][c]) return r;
    return -1;
  }
  function columnHasFalling(c) { return falling.some(f => f.col === c); }

  function startCrashWarning(reason = 'あふれそう!', cols = []) {
    if (gameState !== State.PLAY) return;
    const unique = [...new Set(cols.filter(c => Number.isInteger(c) && c >= 0 && c < COLS))];
    forcedCrashColumns = [...new Set([...forcedCrashColumns, ...unique])];
    if (!crashActive) {
      crashActive = true;
      crashTimer = CRASH_GRACE;
      crashStage = 0;
      showMiniNotice(reason, '#ffb0b4');
      addFloatText(W / 2, BOARD_Y + 24, 'CRASH猶予! 発射して戻そう!', 16, '#ffb0b4', .95);
      playTone('bad', .42);
      vibrate(18);
    } else {
      // CRASH中に追加の警告が来ても、カウントは戻さない。
      // ここでタイマーを延長すると「5に戻って進まない」ように見える。
      if (softWarningCooldown <= 0) {
        softWarningCooldown = .85;
        showMiniNotice(reason, '#ffb0b4');
      }
    }
  }

  function spawnMeteor(forceCount = null) {
    if (gameState !== State.PLAY) return;
    let count = forceCount ?? (Math.random() < (fever > 0 ? .55 : .30) ? 2 : 1);
    if (timeLeft < 42 && Math.random() < .24) count++;
    if (timeLeft < 22 && Math.random() < .18) count++;
    const cols = [...Array(COLS).keys()].sort(() => Math.random() - .5);
    let spawned = 0;
    for (const c of cols) {
      if (spawned >= count) break;
      if (columnHasFalling(c)) continue;
      const target = lowestEmptyRow(c);
      if (target < 0) {
        danger = clamp(danger + 22, 0, 100);
        addFloatText(centerX(c), BOARD_Y + 18, '入りきらない!', 16, '#ff9a9a', .70);
        startCrashWarning('あふれそう!', [c]);
        continue;
      }
      const t = makeTile(Math.floor(Math.random() * activeColors));
      t.col = c; t.row = -1;
      t.x = gridToX(c); t.y = BOARD_Y - CELL - rand(40, 5);
      t.tx = gridToX(c); t.ty = gridToY(target);
      t.vy = (fever > 0 ? 275 : 205) + rand(70) + elapsedSeconds() * 1.4;
      t.scale = .88; t.targetScale = 1;
      falling.push(t);
      spawned++;
    }
  }

  function settleFalling(dt) {
    for (let i = falling.length - 1; i >= 0; i--) {
      const t = falling[i];
      const target = lowestEmptyRow(t.col);
      if (target < 0) {
        t.y += t.vy * dt;
        if (t.y > BOARD_Y + BOARD_H) {
          falling.splice(i, 1);
          danger = clamp(danger + 22, 0, 100);
          startCrashWarning('あふれた!', [t.col]);
        }
        continue;
      }
      t.ty = gridToY(target);
      t.y += t.vy * dt;
      t.x = lerp(t.x, t.tx, 1 - Math.pow(.001, dt));
      t.rot += t.spin * dt;
      if (t.y >= t.ty) {
        t.y = t.ty;
        placeGround(t, target, t.col, false);
        falling.splice(i, 1);
        t.just = .18;
        addParticle(centerX(t.col), centerY(target), tileColor(t), 4, 60, 'spark');
        if (target <= 1) danger = clamp(danger + 5, 0, 100);
      }
    }
  }

  function updateFloatGroups(dt) {
    for (let i = floatGroups.length - 1; i >= 0; i--) {
      const g = floatGroups[i];
      g.age += dt;
      g.hot = Math.max(0, g.hot - dt * .7);
      g.offset += g.vy * dt;

      // 上に到達したら、止まらずに「すぐ低速で落ち始める」。
      // hoverTimeは停止時間ではなく、低速落下の時間として使う。
      if (!g.topReached && g.offset <= -g.lift) {
        g.offset = -g.lift;
        g.topReached = true;
        if (g.vy < 12) g.vy = 12;
      }

      if (g.topReached) {
        if (g.hoverTime > 0) {
          g.hoverTime = Math.max(0, g.hoverTime - dt);
          g.vy += g.gravity * dt * .10;
          g.vy = Math.min(g.vy, fever > 0 ? 16 : 20);
        } else if ((g.slowFall || 0) > 0) {
          g.slowFall = Math.max(0, g.slowFall - dt);
          g.vy += g.gravity * dt * .28;
          g.vy = Math.min(g.vy, fever > 0 ? 30 : 38);
        } else {
          if (g.vy < 16) g.vy = 16;
          g.vy += g.gravity * dt * 1.10;
        }
      } else {
        g.vy += g.gravity * dt * .72;
      }

      g.warning = clamp((g.offset + 40) / 40, 0, 1);
      if (g.warning > .02) {
        danger = clamp(danger + g.warning * dt * (g.heavy ? 13 : 7), 0, 100);
      }
      updateGroupTileTargets(g);
      if (g.offset >= 0 && g.age > .45) {
        landFloatGroup(g);
        i = Math.min(i, floatGroups.length);
      }
    }
  }

  function landFloatGroup(g) {
    floatGroups = floatGroups.filter(x => x !== g);
    const columns = new Map();
    for (const t of g.tiles) {
      if (!columns.has(t.col)) columns.set(t.col, []);
      columns.get(t.col).push(t);
    }
    let overflow = 0;
    const overflowColumns = [];
    for (const [c, tiles] of columns) {
      const existing = [];
      for (let r = ROWS - 1; r >= 0; r--) {
        if (ground[r][c]) existing.push(ground[r][c]);
        ground[r][c] = null;
      }
      tiles.sort((a, b) => b.row - a.row); // bottom side first.
      const merged = existing.concat(tiles);
      let r = ROWS - 1;
      for (const t of merged) {
        if (r < 0) { overflow++; overflowColumns.push(c); continue; }
        placeGround(t, r, c, false);
        t.just = .16;
        r--;
      }
    }
    const center = groupCenter({ ...g, offset: 0 });
    const shock = g.weight >= 9 ? 18 : g.weight >= 4 ? 12 : 7;
    danger = clamp(danger + shock + overflow * 20, 0, 100);
    addFloatText(center.x, Math.max(BOARD_Y + 36, center.y), g.heavy ? 'ドスン! 危険!' : '着地!', g.heavy ? 20 : 16, g.heavy ? '#ff9a9a' : '#ffffff', .7);
    addShockwave(center.x, clamp(center.y, BOARD_Y + 40, BOARD_Y + BOARD_H - 30), 90 + (g.payload ?? g.mass) * 3, 'rgba(255,110,120,.65)', .36);
    addParticle(center.x, clamp(center.y, BOARD_Y + 40, BOARD_Y + BOARD_H - 30), '#ffb0b4', 8 + Math.min(18, g.payload ?? g.mass), 130, 'dust');
    shake += .22 + Math.min(.65, (g.payload ?? g.mass) * .025);
    playTone('bad', g.heavy ? .58 : .34);
    if (overflow > 0) startCrashWarning('着地であふれた!', overflowColumns);
  }

  function getCrashOverflowInfo() {
    const columns = [];
    let overflow = 0;
    let topMost = ROWS;
    for (let c = 0; c < COLS; c++) {
      let topRow = ROWS;
      for (let r = 0; r < ROWS; r++) {
        if (ground[r][c]) { topRow = r; break; }
      }
      if (topRow < 2) {
        const amount = 2 - topRow;
        overflow += amount;
        topMost = Math.min(topMost, topRow);
        columns.push({ c, amount, topRow });
      }
    }
    return { overflow, columns, topMost };
  }

  function crashDisplayCount() {
    return clamp(Math.ceil((crashTimer / CRASH_GRACE) * 5), 1, 5);
  }

  function warningStageFromTimer(timer, overflow) {
    if (!crashActive) return 0;
    const progress = clamp(1 - timer / CRASH_GRACE, 0, 1);
    let stage = progress < .25 ? 1 : progress < .50 ? 2 : progress < .75 ? 3 : 4;
    if (overflow >= 2) stage = Math.max(stage, 2);
    if (overflow >= 4) stage = Math.max(stage, 3);
    return stage;
  }

  function updateCrashPressure(dt) {
    if (gameState !== State.PLAY) return;
    const info = getCrashOverflowInfo();
    const redCols = info.columns.map(v => v.c);
    forcedCrashColumns = forcedCrashColumns.filter(c => redCols.includes(c));

    const multiColumnThreat = info.columns.length >= 2;
    const forcedThreat = forcedCrashColumns.length > 0;
    const softOneColumnWarning = info.columns.length === 1 && !multiColumnThreat && !forcedThreat;
    const activeThreat = multiColumnThreat || forcedThreat;

    crashWarningColumns = info.columns.map(v => v.c);

    if (softOneColumnWarning && !crashActive) {
      danger = clamp(Math.max(danger, 48), 0, 100);
      if (softWarningCooldown <= 0) {
        softWarningCooldown = 2.2;
        showMiniNotice('1列あぶない!', '#ffb0b4');
        addFloatText(centerX(info.columns[0].c), BOARD_Y + 26, 'ここが高い! まだ死なない!', 14, '#ffb0b4', .85);
        playTone('bad', .22);
        vibrate(8);
      }
      crashStage = 0;
      return;
    }

    if (activeThreat) {
      if (!crashActive) {
        const msg = multiColumnThreat ? '2列あぶない!' : 'あふれそう!';
        startCrashWarning(msg, multiColumnThreat ? redCols : forcedCrashColumns);
      }
      const threatWeight = multiColumnThreat
        ? info.columns.length + Math.max(0, info.overflow - info.columns.length) * .25
        : 1.45;
      const drain = dt * (0.82 + Math.min(1.55, Math.max(0, threatWeight - 1) * .22));
      crashTimer = Math.max(0, crashTimer - drain);
      danger = clamp(Math.max(danger, 52 + (1 - crashTimer / CRASH_GRACE) * 48), 0, 100);
      const nextStage = warningStageFromTimer(crashTimer, multiColumnThreat ? info.overflow : Math.max(2, forcedCrashColumns.length + 1));
      if (nextStage > crashStage) {
        if (nextStage === 1) {
          showMiniNotice('あぶない!', '#ffb0b4');
        } else if (nextStage === 2) {
          showMiniNotice('まだ間に合う!', '#ffb0b4');
          addFloatText(W / 2, BOARD_Y + 42, '発射すれば戻せる!', 15, '#ffb0b4', .75);
        } else if (nextStage === 3) {
          addFloatText(W / 2, BOARD_Y + 48, 'CRASH WARNING!', 18, '#ffccd2', .85);
          shake += .45;
          flash = Math.max(flash, .12);
        } else if (nextStage === 4) {
          addFloatText(W / 2, BOARD_Y + 58, 'LAST CHANCE!', 22, '#ffccd2', .95);
          shake += .75;
          flash = Math.max(flash, .18);
        }
        playTone('bad', .36 + nextStage * .12);
        vibrate(10 + nextStage * 9);
      }
      crashStage = nextStage;
      if (crashTimer <= 0) checkCrash();
    } else {
      if (crashActive) {
        showMiniNotice('ピンチ脱出!', '#b9f4ff');
        danger = clamp(danger - 28, 0, 100);
      }
      crashActive = false;
      crashTimer = 0;
      crashStage = 0;
      forcedCrashColumns = [];
      if (info.columns.length === 0) crashWarningColumns = [];
      if (danger < 42) dangerStage = 0;
    }
  }

  function checkCrash() {
    if (gameState !== State.PLAY) return;
    if (crashActive && crashTimer <= 0) endGame();
  }

  function topPressure() {
    let p = 0;
    for (let c = 0; c < COLS; c++) {
      let height = 0;
      for (let r = 0; r < ROWS; r++) {
        if (ground[r][c]) { height = ROWS - r; break; }
      }
      if (height > 6) p += (height - 6) / 4;
    }
    return clamp(p / COLS, 0, 1.6);
  }

  function maxGroundHeight() {
    let m = 0;
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        if (ground[r][c]) { m = Math.max(m, ROWS - r); break; }
      }
    }
    return m;
  }

  function elapsedSeconds() {
    return Math.max(0, (performance.now() - gameStartedAt) / 1000);
  }

  function update(dt) {
    if (dt > .05) dt = .05;
    rumbleCooldown = Math.max(0, rumbleCooldown - dt);
    softWarningCooldown = Math.max(0, softWarningCooldown - dt);
    flash = Math.max(0, flash - dt * 2.1);
    shake = Math.max(0, shake - dt * 2.4);
    displayedScore = lerp(displayedScore, score, 1 - Math.pow(.0001, dt));

    updateCutins(dt);
    updateParticles(dt);
    updateFloatTexts(dt);
    updateShockwaves(dt);
    updateSparkLines(dt);
    updateLaunchers(dt);

    if (gameState !== State.PLAY || paused) {
      if (gameState === State.OVER && gameOverTimer > 0) {
        gameOverTimer = Math.max(0, gameOverTimer - dt);
        if (gameOverTimer <= 0) {
          gameOverScoreReady = true;
          if (!scoreSfxPlayed) {
            scoreSfxPlayed = true;
            playFileSfx('score', 1);
          }
        }
      }
      updateTiles(dt);
      return;
    }

    if (cutinFreeze > 0) {
      cutinFreeze = Math.max(0, cutinFreeze - dt);
      updateTiles(dt);
      return;
    }

    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; endGame(); }

    const elapsed = elapsedSeconds();
    spawnInterval = clamp(.92 - elapsed * .0032, .42, .92);
    if (fever > 0) spawnInterval *= .78;
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnMeteor();
      spawnTimer += spawnInterval;
    }

    fever = Math.max(0, fever - dt);
    comboHold -= dt;
    if (comboHold <= 0) { combo = 0; comboHoldMax = 0; lastLionAwardCombo = 0; }

    settleFalling(dt);
    updateFloatGroups(dt);
    updateTiles(dt);

    const p = topPressure();
    danger = clamp(danger + p * dt * 18 - (p < .15 && !floatGroups.length ? dt * 5 : 0), 0, 100);
    updateCrashPressure(dt);
    checkCrash();
  }

  function updateTiles(dt) {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = ground[r][c];
        if (t) updateTileMotion(t, dt);
      }
    }
    for (const t of falling) updateTileMotion(t, dt, true);
    for (const g of floatGroups) {
      for (const t of g.tiles) updateTileMotion(t, dt, false, g.hot);
    }
  }

  function updateTileMotion(t, dt, free = false, hot = 0) {
    t.age += dt;
    if (!free) {
      t.x = lerp(t.x, t.tx, 1 - Math.pow(.00005, dt));
      t.y = lerp(t.y, t.ty, 1 - Math.pow(.00005, dt));
    }
    t.scale = lerp(t.scale, t.targetScale + hot * .025, 1 - Math.pow(.0001, dt));
    t.targetScale = lerp(t.targetScale, 1, 1 - Math.pow(.004, dt));
    t.rot = lerp(t.rot, 0, 1 - Math.pow(.01, dt));
    t.flash = Math.max(0, t.flash - dt * 3);
    t.just = Math.max(0, t.just - dt);
  }

  function updateLaunchers(dt) {
    for (let i = launchers.length - 1; i >= 0; i--) {
      const l = launchers[i];
      l.age += dt;
      for (const it of l.tiles) {
        it.x += (it.vx + Math.sin(l.age * 11 + it.tile.id) * 20) * dt;
        it.y += it.vy * dt;
        it.vy -= 430 * dt;
        it.rot += it.spin * dt;
        if (Math.random() < dt * 20) addParticle(it.x + TILE / 2, it.y + TILE / 2, l.fever ? '#fff58c' : l.color, 1, 110, 'flame');
      }
      if (l.tiles.every(it => it.y < BOARD_Y - CELL * 2.2)) launchers.splice(i, 1);
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += (p.kind === 'dust' ? 180 : 260) * dt;
      p.vx *= Math.pow(.16, dt);
      p.rot += p.spin * dt;
    }
  }

  function updateFloatTexts(dt) {
    for (let i = floatTexts.length - 1; i >= 0; i--) {
      const f = floatTexts[i];
      f.life -= dt;
      if (f.life <= 0) { floatTexts.splice(i, 1); continue; }
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      f.vy += 20 * dt;
    }
  }

  function updateShockwaves(dt) {
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const s = shockwaves[i];
      s.life -= dt;
      if (s.life <= 0) shockwaves.splice(i, 1);
    }
  }

  function updateSparkLines(dt) {
    for (let i = sparkLines.length - 1; i >= 0; i--) {
      const s = sparkLines[i];
      s.life -= dt;
      if (s.life <= 0) sparkLines.splice(i, 1);
    }
  }

  function updateCutins(dt) {
    for (let i = cutins.length - 1; i >= 0; i--) {
      const c = cutins[i];
      c.life -= dt;
      if (c.life <= 0) cutins.splice(i, 1);
    }
  }

  function render() {
    resetCanvasTransform();
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    drawBackground();

    let sx = 0, sy = 0;
    if (shake > 0) {
      const pow = shake * shake;
      sx = rand(7, -7) * pow;
      sy = rand(6, -6) * pow;
    }
    if (crashActive) {
      const s = Math.max(1, crashStage) * (crashStage >= 4 ? 1.9 : 1.1);
      const now = performance.now();
      sx += Math.sin(now * .055) * s + rand(s * .45, -s * .45);
      sy += Math.cos(now * .061) * s * .55;
    }
    ctx.translate(sx, sy);

    drawHeader();
    drawBoard();
    drawFallingTrails();
    drawGroundTiles();
    drawFloatingGroups();
    drawFallingTiles();
    drawLaunchers();
    drawParticles();
    drawShockwaves();
    drawSparkLines();
    // footer removed for larger 11-row board
    drawFloatTexts();

    ctx.restore();

    if (flash > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(.45, flash);
      ctx.fillStyle = fever > 0 ? '#fff58c' : '#ffffff';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    drawCrashCountdownOverlay();
    drawCutins();
    if (gameState === State.TITLE) drawTitleOverlay();
    if (gameState === State.OVER) drawGameOverOverlay();
  }

  function roundedRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawBackground() {
    const feverMix = fever > 0 ? Math.sin(performance.now() * .008) * .5 + .5 : 0;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, fever > 0 ? `rgb(${44 + feverMix * 34}, ${67 + feverMix * 26}, 138)` : '#132c66');
    g.addColorStop(.44, '#09173e');
    g.addColorStop(1, '#060711');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalAlpha = .17 + (fever > 0 ? .16 : 0);
    for (let i = 0; i < 48; i++) {
      const x = (i * 83 + 19) % W;
      const y = (i * 157 + 35 + performance.now() * .006 * (i % 3 + 1)) % H;
      ctx.fillStyle = i % 7 === 0 ? '#ffe69a' : '#ffffff';
      ctx.beginPath();
      ctx.arc(x, y, i % 7 === 0 ? 1.8 : 1.1, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    const sunX = 328, sunY = 82;
    const rg = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 160 + (fever > 0 ? 80 : 0));
    rg.addColorStop(0, 'rgba(255,238,105,.68)');
    rg.addColorStop(.35, 'rgba(255,170,60,.21)');
    rg.addColorStop(1, 'rgba(255,170,60,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 220, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawHeader() {
    ctx.save();
    // score
    roundedRect(16, 18, 200, 60, 19);
    ctx.fillStyle = 'rgba(9,18,43,.74)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.13)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.64)'; ctx.font = '800 10px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('SCORE', 30, 39);
    ctx.fillStyle = '#fff'; ctx.font = '900 25px system-ui, sans-serif';
    ctx.fillText(String(Math.round(displayedScore)).padStart(6, '0'), 28, 68);

    // time
    roundedRect(224, 18, 74, 60, 19);
    ctx.fillStyle = timeLeft < 16 && gameState === State.PLAY ? 'rgba(130,27,35,.76)' : 'rgba(9,18,43,.74)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.13)'; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.64)'; ctx.font = '800 10px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('TIME', 261, 39);
    ctx.fillStyle = '#fff'; ctx.font = '900 25px system-ui, sans-serif';
    ctx.fillText(String(Math.ceil(timeLeft)), 261, 68);

    // sound
    roundedRect(326, 42, 44, 44, 17);
    ctx.fillStyle = 'rgba(255,255,255,.11)'; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '19px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(muted ? '×' : '♪', 348, 69);

    drawComboPanel();
    drawSunGauge();
    ctx.restore();
  }

  function drawComboPanel() {
    const x = 18, y = 92, w = 166, h = 76;
    const active = comboHold > 0 && combo > 0;
    const limit = comboHoldMax || chainDuration('quick');
    const ratio = active ? clamp(comboHold / limit, 0, 1) : 0;
    const mult = active ? tempoMultiplier(combo) : 1;
    roundedRect(x, y, w, h, 22);
    ctx.fillStyle = active ? 'rgba(20,33,70,.78)' : 'rgba(9,18,43,.68)';
    ctx.fill();
    ctx.strokeStyle = active ? 'rgba(185,244,255,.60)' : 'rgba(255,255,255,.13)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,.62)';
    ctx.font = '800 10px system-ui, sans-serif';
    ctx.fillText('COMBO', x + 14, y + 22);
    ctx.fillStyle = active ? '#b9f4ff' : '#ffffff';
    ctx.font = '900 28px system-ui, sans-serif';
    ctx.fillText(String(active ? combo : 0), x + 14, y + 53);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff58c';
    ctx.font = '900 19px system-ui, sans-serif';
    ctx.fillText(`×${mult.toFixed(2)}`, x + w - 14, y + 51);

    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,.58)';
    ctx.font = '800 9px system-ui, sans-serif';
    ctx.fillText('CHAIN TIME', x + 14, y + 67);
    const bx = x + 82, by = y + 62, bw = w - 98, bh = 6;
    roundedRect(bx, by, bw, bh, 4);
    ctx.fillStyle = 'rgba(255,255,255,.13)'; ctx.fill();
    roundedRect(bx, by, Math.max(0, bw * ratio), bh, 4);
    const gd = ctx.createLinearGradient(bx, by, bx + bw, by);
    gd.addColorStop(0, '#3eb4ff'); gd.addColorStop(.55, '#fff58c'); gd.addColorStop(1, '#ff874d');
    ctx.fillStyle = gd; ctx.fill();
  }

  function drawSunGauge() {
    const x = 198, y = 92, w = 172, h = 76;
    roundedRect(x, y, w, h, 22);
    ctx.fillStyle = fever > 0 ? 'rgba(255,236,93,.16)' : 'rgba(255,236,93,.12)'; ctx.fill();
    ctx.strokeStyle = fever > 0 ? 'rgba(255,245,140,.82)' : 'rgba(255,236,93,.32)'; ctx.stroke();
    drawSunnyBadge(x + 34, y + 38, 18, { damage: crashActive || danger > 74, feverMode: fever > 0 });
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff58c'; ctx.font = '900 14px system-ui, sans-serif';
    ctx.fillText(fever > 0 ? 'FEVER中!' : 'サニーゲージ', x + 62, y + 22);
    ctx.fillStyle = 'rgba(255,255,255,.65)'; ctx.font = '800 10px system-ui, sans-serif';
    ctx.fillText(fever > 0 ? 'リング高速回転 / 浮遊長め / 点数UP' : '空中発射だけでたまる', x + 62, y + 38);
    ctx.fillText(fever > 0 ? '約30秒! ゲージ増加なし' : '即発射ではたまらない', x + 62, y + 50);
    const gx = x + 62, gy = y + 58, gw = 94, gh = 7;
    roundedRect(gx, gy, gw, gh, 4); ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fill();
    const fill = fever > 0 ? gw * (fever / FEVER_SECONDS) : gw * (sunGauge / 100);
    roundedRect(gx, gy, Math.max(gh, fill), gh, 4);
    const gg = ctx.createLinearGradient(gx, gy, gx + gw, gy);
    gg.addColorStop(0, '#ff914d'); gg.addColorStop(.6, '#fff36a'); gg.addColorStop(1, '#ffffff');
    ctx.fillStyle = gg; ctx.fill();
  }

  function drawBoard() {
    ctx.save();
    roundedRect(BOARD_X - 10, BOARD_Y - 10, BOARD_W + 20, BOARD_H + 20, 24);
    const bg = ctx.createLinearGradient(0, BOARD_Y, 0, BOARD_Y + BOARD_H);
    bg.addColorStop(0, 'rgba(11,22,51,.88)');
    bg.addColorStop(1, 'rgba(4,9,24,.90)');
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.strokeStyle = fever > 0 ? 'rgba(255,245,140,.66)' : 'rgba(136,183,255,.28)';
    ctx.lineWidth = 2; ctx.stroke();

    // crash line
    ctx.save();
    const lineY = BOARD_Y + CELL * 2;
    const softWarning = !crashActive && crashWarningColumns.length > 0;
    const linePulse = crashActive ? Math.sin(performance.now() * .035) * .5 + .5 : Math.sin(performance.now() * (softWarning ? .020 : .012)) * .14 + .62;
    ctx.globalAlpha = crashActive ? .78 + linePulse * .22 : (softWarning ? .72 + linePulse * .18 : linePulse);
    ctx.strokeStyle = crashActive ? '#ff4052' : (softWarning || danger > 55 ? '#ff6b75' : 'rgba(255,107,117,.58)');
    ctx.lineWidth = crashActive ? 3.5 : (softWarning || danger > 55 ? 3 : 2);
    ctx.setLineDash([8, 6]);
    ctx.beginPath(); ctx.moveTo(BOARD_X - 2, lineY); ctx.lineTo(BOARD_X + BOARD_W + 2, lineY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = crashActive ? '#ffd0d3' : (danger > 55 ? '#ffb0b4' : 'rgba(255,176,180,.75)');
    ctx.font = '900 10px system-ui, sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(crashActive ? 'CRASH WARNING' : (crashWarningColumns.length ? 'DANGER LINE' : 'CRASH LINE'), BOARD_X + BOARD_W - 4, lineY - 5);
    ctx.restore();

    if (crashActive) {
      ctx.save();
      const gx = BOARD_X + 10, gy = BOARD_Y - 33, gw = BOARD_W - 20, gh = 14;
      roundedRect(gx - 6, gy - 8, gw + 12, 30, 13);
      ctx.fillStyle = 'rgba(70,5,14,.78)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,130,140,.65)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.textAlign = 'left';
      ctx.fillStyle = '#ffd0d3';
      ctx.font = '900 10px system-ui, sans-serif';
      ctx.fillText(crashStage >= 4 ? `LAST CHANCE! ${crashDisplayCount()}` : `CRASHまで ${crashDisplayCount()}`, gx, gy + 4);
      const ratio = clamp(crashTimer / CRASH_GRACE, 0, 1);
      roundedRect(gx + 100, gy - 2, gw - 110, gh, 7);
      ctx.fillStyle = 'rgba(255,255,255,.16)';
      ctx.fill();
      roundedRect(gx + 100, gy - 2, Math.max(2, (gw - 110) * ratio), gh, 7);
      const cg = ctx.createLinearGradient(gx + 100, gy, gx + gw, gy);
      cg.addColorStop(0, '#ff4052');
      cg.addColorStop(.45, '#ffd64d');
      cg.addColorStop(1, '#55df80');
      ctx.fillStyle = cg;
      ctx.fill();
      ctx.restore();
    }

    if (danger > 24 || crashActive || crashWarningColumns.length) {
      ctx.globalAlpha = clamp(((crashActive ? Math.max(danger, 72 + crashStage * 6) : danger) - 24) / 76, 0, .72);
      const rg = ctx.createLinearGradient(0, BOARD_Y - 10, 0, BOARD_Y + 132);
      rg.addColorStop(0, 'rgba(255,73,82,.72)');
      rg.addColorStop(1, 'rgba(255,73,82,0)');
      ctx.fillStyle = rg;
      roundedRect(BOARD_X - 8, BOARD_Y - 8, BOARD_W + 16, 150, 22);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.globalAlpha = .20;
    ctx.strokeStyle = '#c8ddff'; ctx.lineWidth = 1;
    for (let c = 1; c < COLS; c++) { ctx.beginPath(); ctx.moveTo(BOARD_X + c * CELL, BOARD_Y + 4); ctx.lineTo(BOARD_X + c * CELL, BOARD_Y + BOARD_H - 4); ctx.stroke(); }
    for (let r = 1; r < ROWS; r++) { ctx.beginPath(); ctx.moveTo(BOARD_X + 4, BOARD_Y + r * CELL); ctx.lineTo(BOARD_X + BOARD_W - 4, BOARD_Y + r * CELL); ctx.stroke(); }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function crashColumnJitter(c) {
    if (!crashWarningColumns.includes(c)) return null;
    const now = performance.now();
    const stage = crashActive ? Math.max(1, crashStage) : 1;
    const amp = (crashActive ? stage * (stage >= 4 ? 2.0 : 1.25) : 1.05);
    return {
      x: Math.sin(now * .092 + c * 1.7) * amp + rand(.55, -.55) * amp,
      y: Math.cos(now * .078 + c * 1.3) * amp * .35
    };
  }

  function drawGroundTiles() {
    ctx.save();
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = ground[r][c];
        if (t) {
          const j = crashColumnJitter(c);
          if (j) {
            ctx.save();
            ctx.translate(j.x, j.y);
            drawTile(t);
            ctx.restore();
          } else {
            drawTile(t);
          }
        }
      }
    }
    if (selectedHint && selectedHint.layer === 'ground' && ground[selectedHint.r]?.[selectedHint.c]) {
      drawSelection(centerX(selectedHint.c), centerY(selectedHint.r));
    }
    ctx.restore();
  }

  function drawFloatingGroups() {
    ctx.save();
    for (const g of floatGroups) {
      const b = groupBounds(g);
      // shadow on board where it will land
      ctx.save();
      ctx.globalAlpha = .16 + g.warning * .24;
      roundedRect(b.x, gridToY(b.minR) - 2, b.w, b.h, 16);
      ctx.fillStyle = g.heavy ? '#ff6b75' : '#b9f4ff';
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = .36 + g.hot * .18 + g.warning * .18;
      ctx.strokeStyle = g.warning > .2 ? '#ff9a9a' : '#b9f4ff';
      ctx.lineWidth = 2 + g.warning * 2;
      roundedRect(b.x, b.y, b.w, b.h, 17);
      ctx.stroke();
      ctx.restore();

      for (const t of g.tiles) drawTile(t, g.warning > .25 ? .11 : .06);
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '900 13px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(5,8,20,.65)';
      ctx.strokeStyle = 'rgba(185,244,255,.72)';
      ctx.lineWidth = 2;
      for (const t of g.tiles) {
        if (!isFloatingAnchor(g, t)) continue;
        const ax = centerX(t.col), ay = centerY(t.row) + g.offset + 12;
        ctx.beginPath(); ctx.arc(ax, ay, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#b9f4ff'; ctx.fillText('×', ax, ay + 0.5); ctx.fillStyle = 'rgba(5,8,20,.65)';
      }
      ctx.restore();

      // small, clear label and falling gauge
      const cx = b.x + b.w / 2;
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '900 12px system-ui, sans-serif';
      ctx.fillStyle = g.warning > .45 ? '#ffb0b4' : '#fff58c';
