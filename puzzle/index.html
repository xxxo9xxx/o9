      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(5,8,20,.76)';
      const label = g.warning > .55 ? '落ちる! 空中3つ!' : `${g.label} 乗り数${g.weight} ${g.ignitesNeeded > 1 ? `点火${g.ignitesDone}/${g.ignitesNeeded}` : `×${weightMultiplier(g.weight).toFixed(1)}`}`;
      ctx.strokeText(label, cx, b.y - 8);
      ctx.fillText(label, cx, b.y - 8);
      const barW = Math.min(120, Math.max(44, b.w - 16));
      const barX = cx - barW / 2;
      const barY = b.y - 3;
      roundedRect(barX, barY, barW, 5, 3); ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fill();
      roundedRect(barX, barY, barW * clamp(-g.offset / g.lift, 0, 1), 5, 3);
      ctx.fillStyle = g.warning > .35 ? '#ff6b75' : '#b9f4ff'; ctx.fill();
      ctx.restore();
    }
    if (selectedHint && selectedHint.layer === 'float' && selectedHint.group && floatGroups.includes(selectedHint.group)) {
      drawSelection(centerX(selectedHint.c), centerY(selectedHint.r) + selectedHint.group.offset, '#b9f4ff');
    }
    ctx.restore();
  }

  function drawSelection(cx, cy, color = '#fff') {
    const pulse = Math.sin(performance.now() * .012) * .5 + .5;
    ctx.save();
    ctx.strokeStyle = color === '#fff' ? `rgba(255,255,255,${.60 + pulse * .24})` : `rgba(185,244,255,${.65 + pulse * .24})`;
    ctx.lineWidth = 3;
    roundedRect(cx - TILE / 2 - 3, cy - TILE / 2 - 3, TILE + 6, TILE + 6, ROUND + 5);
    ctx.stroke();
    ctx.restore();
  }

  function drawFallingTrails() {
    ctx.save();
    for (const t of falling) {
      const x = t.x + TILE / 2;
      const y = t.y + TILE / 2;
      const grad = ctx.createLinearGradient(x, y - 70, x, y + 8);
      grad.addColorStop(0, 'rgba(255,255,255,0)');
      grad.addColorStop(1, hexToRgba(tileColor(t), .35));
      ctx.strokeStyle = grad; ctx.lineWidth = 5; ctx.lineCap = 'round';

  function drawLaunchers() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const l of launchers) {
      for (const it of l.tiles) {
        const grad = ctx.createLinearGradient(it.x, it.y + 72, it.x, it.y - 10);
        grad.addColorStop(0, l.fever ? 'rgba(255,246,120,.74)' : hexToRgba(l.color, .58));
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = grad; ctx.lineWidth = 14; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(it.x + TILE / 2, it.y + TILE + 54); ctx.lineTo(it.x + TILE / 2 + Math.sin(l.age * 14 + it.tile.id) * 7, it.y + 12); ctx.stroke();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    for (const l of launchers) {
      for (const it of l.tiles) {
        const old = { x: it.tile.x, y: it.tile.y, rot: it.tile.rot, scale: it.tile.scale };
        it.tile.x = it.x; it.tile.y = it.y; it.tile.rot = it.rot; it.tile.scale = 1 + Math.sin(l.age * 17 + it.tile.id) * .03;
        drawTile(it.tile, l.fever ? .18 : .08);
        it.tile.x = old.x; it.tile.y = old.y; it.tile.rot = old.rot; it.tile.scale = old.scale;

  function drawTile(t, extraGlow = 0, fallingTile = false) {
    const isLion = isLionTile(t);
    const col = isLion ? { fill: '#ffe17a', edge: '#fff4b4', dark: '#8b5a18', mark: '' } : COLORS[t.type % COLORS.length];
    const cx = t.x + TILE / 2;
    const cy = t.y + TILE / 2;
    const scale = t.scale * (t.just > 0 ? 1 + t.just * .15 : 1);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t.rot);
    ctx.scale(scale, scale);
    ctx.shadowColor = col.fill;
    ctx.shadowBlur = 16 * (.12 + extraGlow + t.flash * .6 + (isLion ? .18 : 0));
    roundedRect(-TILE / 2, -TILE / 2, TILE, TILE, ROUND);
    const g = ctx.createLinearGradient(-TILE / 2, -TILE / 2, TILE / 2, TILE / 2);
    if (isLion) {
      const tnow = performance.now() * .001;
      const pulse = Math.sin(tnow * 6 + t.id) * .5 + .5;
      g.addColorStop(0, pulse > .5 ? '#fffbe0' : '#fff4b4');
      g.addColorStop(.38, '#ffd75f');
      g.addColorStop(.72, '#d081ff');
      g.addColorStop(1, '#27143b');
    } else {
      g.addColorStop(0, col.edge); g.addColorStop(.48, col.fill); g.addColorStop(1, col.dark);
    }
    ctx.fillStyle = g; ctx.fill();

    if (isLion) {
      const tnow = performance.now() * .001;
      const pulse = Math.sin(tnow * 7 + t.id) * .5 + .5;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = .45 + pulse * .30;
      ctx.strokeStyle = '#fff58c';
      ctx.lineWidth = 2.2 + pulse * 1.2;
      roundedRect(-TILE / 2 + 2, -TILE / 2 + 2, TILE - 4, TILE - 4, ROUND - 1);
      ctx.stroke();
      ctx.rotate(tnow * 1.8 + t.id);
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2;
        const sx = Math.cos(a) * TILE * .34;
        const sy = Math.sin(a) * TILE * .34;
        ctx.fillStyle = i % 2 ? '#b9f4ff' : '#fff58c';
        ctx.beginPath();
        ctx.moveTo(sx, sy - 4);
        ctx.lineTo(sx + 2.4, sy);
        ctx.lineTo(sx, sy + 4);
        ctx.lineTo(sx - 2.4, sy);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    ctx.shadowBlur = 0;
    ctx.strokeStyle = isLion ? 'rgba(255,248,180,.96)' : 'rgba(255,255,255,.48)'; ctx.lineWidth = isLion ? 2.4 : 1.35;
    roundedRect(-TILE / 2 + 1.5, -TILE / 2 + 1.5, TILE - 3, TILE - 3, ROUND - 2); ctx.stroke();
    ctx.globalAlpha = isLion ? .26 : .33;
    ctx.fillStyle = '#fff'; roundedRect(-TILE / 2 + 7, -TILE / 2 + 6, TILE - 18, 11, 8); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (isLion) {
      drawLionSilhouetteMark(0, 0, TILE * .35);
      ctx.fillStyle = '#fff8c9';
      ctx.font = '900 8px system-ui, sans-serif';
      ctx.fillText('SPECIAL', 0, TILE / 2 - 7);
    } else {
      ctx.fillStyle = t.type === 5 ? 'rgba(59,69,116,.95)' : 'rgba(255,255,255,.92)';
      ctx.font = '900 20px system-ui, sans-serif';
      ctx.fillText(col.mark, 0, 2);
    }
    if (fallingTile) {
      ctx.globalAlpha = .68;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      roundedRect(-TILE / 2 - 2, -TILE / 2 - 2, TILE + 4, TILE + 4, ROUND + 3); ctx.stroke();
    }
    ctx.restore();
  }


  function drawLionSilhouetteMark(x, y, r) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = 'rgba(32,20,12,.92)';
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI * 2 / 12;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * r * .46, Math.sin(a) * r * .46, r * .25, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(0, 0, r * .62, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,236,150,.95)';
    ctx.beginPath(); ctx.arc(-r * .20, -r * .08, r * .06, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * .20, -r * .08, r * .06, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,236,150,.95)';
    ctx.lineWidth = Math.max(1.5, r * .08);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, r * .08, r * .24, .12, Math.PI - .12); ctx.stroke();
    ctx.restore();
  }

  function drawParticles() {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      const a = clamp(p.life / p.maxLife, 0, 1);
      ctx.globalAlpha = a;
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.kind === 'flame' || p.kind === 'dust') {
        const g = ctx.createRadialGradient(0, 0, 1, 0, 0, p.size * 2.3);
        g.addColorStop(0, p.kind === 'dust' ? p.color : '#fff');
        g.addColorStop(.45, p.color); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, p.size * 2.3, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = p.color; ctx.beginPath(); ctx.moveTo(0, -p.size); ctx.lineTo(p.size * .55, 0); ctx.lineTo(0, p.size); ctx.lineTo(-p.size * .55, 0); ctx.closePath(); ctx.fill();
      }
      resetCanvasTransform();
    }
    ctx.restore();
  }

    ctx.save();

  function drawCutins() {
    for (const c of cutins) {
      const t = 1 - c.life / c.maxLife;
      const a = clamp(c.life / c.maxLife, 0, 1);
      if (c.kind === 'mini') {
        ctx.save();
        ctx.globalAlpha = Math.min(1, a * 1.2);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.translate(W / 2, 198 - t * 14);
        ctx.font = '900 31px system-ui, sans-serif'; ctx.lineWidth = 7;
        ctx.strokeStyle = 'rgba(5,8,20,.82)'; ctx.strokeText(c.title, 0, 0);
        ctx.fillStyle = c.color; ctx.fillText(c.title, 0, 0);
        ctx.restore();
        continue;
      }
      ctx.save();
      const enter = t < .22 ? easeOutCubic(t / .22) : 1;
      const exit = t > .80 ? 1 - easeOutCubic((t - .80) / .20) : 1;
      const k = enter * exit;
      ctx.globalAlpha = .62 * k;
      ctx.fillStyle = '#030612'; ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = k;
      ctx.translate(W / 2, H / 2);
      ctx.rotate(-.16);
      const bandW = 520;
      const bandH = c.kind === 'crash' ? 148 : 132;
      const slide = (1 - enter) * -460 + (t > .8 ? (1 - exit) * 460 : 0);
      ctx.translate(slide, 0);
      const grad = ctx.createLinearGradient(-bandW / 2, -bandH / 2, bandW / 2, bandH / 2);
      grad.addColorStop(0, 'rgba(255,255,255,.05)');
      grad.addColorStop(.18, hexToRgba(c.color, .92));
      grad.addColorStop(.55, 'rgba(7,10,24,.96)');
      grad.addColorStop(1, hexToRgba(c.color, .75));
      roundedRect(-bandW / 2, -bandH / 2, bandW, bandH, 26);
      ctx.fillStyle = grad; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.54)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.rotate(.16);
      if (c.kind === 'sun') drawSunnyBadge(-122, 0, 34, { damage: false, feverMode: true });

      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.font = '900 35px system-ui, sans-serif'; ctx.lineWidth = 8;
      ctx.strokeStyle = 'rgba(3,6,18,.86)'; ctx.strokeText(c.title, -54, -18);
      ctx.fillStyle = '#fff'; ctx.fillText(c.title, -54, -18);
      ctx.font = '900 15px system-ui, sans-serif'; ctx.lineWidth = 5;
      ctx.strokeText(c.subtitle, -52, 26);
      ctx.fillStyle = c.color; ctx.fillText(c.subtitle, -52, 26);
      ctx.restore();
    }
  }

    ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = '900 22px system-ui, sans-serif'; ctx.fillText('もう一回', W / 2, 776);
    ctx.restore();
  }

  function drawSvgImage(img, x, y, w, h, rot = 0, alpha = 1) {
    // Some browsers report SVG Image.complete even when the asset is not drawable yet.
    // If drawImage throws once, the whole animation loop stops, so always fail safely.
    if (!img || !img.complete || !img.naturalWidth || !img.naturalHeight) return false;
    try {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.drawImage(img, -w / 2, -h / 2, w, h);
      ctx.restore();
      return true;
    } catch (e) {
      try { ctx.restore(); } catch (_) {}
      return false;
    }
  }

  function drawSunFallback(x, y, r) {
    ctx.save(); ctx.translate(x, y);
    const rot = performance.now() * .001;
    ctx.rotate(rot);
    ctx.strokeStyle = 'rgba(255,247,132,.9)'; ctx.lineWidth = Math.max(3, r * .13); ctx.lineCap = 'round';
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI * 2 / 12;
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * .86, Math.sin(a) * r * .86); ctx.lineTo(Math.cos(a) * r * 1.22, Math.sin(a) * r * 1.22); ctx.stroke();
    }
    ctx.rotate(-rot);
    const g = ctx.createRadialGradient(-r * .25, -r * .25, 4, 0, 0, r);
    g.addColorStop(0, '#fff7a2'); g.addColorStop(.7, '#ffd24a'); g.addColorStop(1, '#ff9d36');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * .82, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6b3c0e'; ctx.beginPath(); ctx.arc(-r * .22, -r * .08, r * .07, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(r * .22, -r * .08, r * .07, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#6b3c0e'; ctx.beginPath(); ctx.arc(0, r * .05, r * .26, .15, Math.PI - .15); ctx.stroke();
    ctx.restore();
  }

  function drawSunnyBadge(x, y, r, opts = {}) {
    const damage = !!opts.damage;
    const feverMode = !!opts.feverMode;
    const scale = opts.scale || 1;
    const faceImg = damage ? uiImages.damageFace : uiImages.sunnyFace;
    const ringImg = uiImages.sunnyRing;
    const speed = feverMode ? .0048 : .00115;
    const angle = performance.now() * speed;
    const pulse = Math.sin(performance.now() * (damage ? .018 : .009)) * .5 + .5;
    ctx.save();
    ctx.translate(x, y);
    const glowR = r * (damage ? 2.25 : feverMode ? 2.6 : 2.2) + pulse * 4;
    const glow = ctx.createRadialGradient(0, 0, r * .18, 0, 0, glowR);
    if (damage) {
      glow.addColorStop(0, 'rgba(255,170,180,.55)');
      glow.addColorStop(.55, 'rgba(255,82,96,.24)');
      glow.addColorStop(1, 'rgba(255,82,96,0)');
    } else if (feverMode) {
      glow.addColorStop(0, 'rgba(255,250,180,.70)');
      glow.addColorStop(.55, 'rgba(255,215,90,.24)');
      glow.addColorStop(1, 'rgba(255,215,90,0)');
    } else {
      glow.addColorStop(0, 'rgba(255,250,180,.52)');
      glow.addColorStop(.6, 'rgba(255,202,90,.18)');
      glow.addColorStop(1, 'rgba(255,202,90,0)');
    }
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, 0, glowR, 0, Math.PI * 2); ctx.fill();
    const drawSize = r * 2 * scale;
    if (!drawSvgImage(ringImg, 0, 0, drawSize, drawSize, angle, damage ? .95 : 1)) {
      ctx.strokeStyle = damage ? 'rgba(255,105,120,.9)' : 'rgba(255,240,120,.95)';
      ctx.lineWidth = Math.max(3, r * .12); ctx.beginPath(); ctx.arc(0, 0, r * scale, 0, Math.PI * 2); ctx.stroke();
    }
    if (damage) {
      ctx.save();
      ctx.rotate(-angle * 1.35);
      ctx.strokeStyle = 'rgba(255,95,108,.85)';
      ctx.lineWidth = Math.max(2.5, r * .10);
      ctx.setLineDash([r * .24, r * .12]);
      ctx.beginPath(); ctx.arc(0, 0, r * 1.18 * scale, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    const ok = drawSvgImage(faceImg, 0, 0, drawSize, drawSize, 0, 1);
    if (!ok) drawSunFallback(0, 0, r);
    ctx.restore();
  }

  function drawSun(x, y, r, face = true) {
    drawSunnyBadge(x, y, r, { damage: !face, feverMode: fever > 0 });
  }

  function drawLionFallback(x, y, r) {
    ctx.save(); ctx.translate(x, y);
    const pulse = Math.sin(performance.now() * .005) * .5 + .5;
    ctx.fillStyle = 'rgba(255,177,66,.18)'; ctx.beginPath(); ctx.arc(0, 0, r * 1.25 + pulse * 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#744017';
    for (let i = 0; i < 16; i++) { const a = i * Math.PI * 2 / 16; ctx.beginPath(); ctx.arc(Math.cos(a) * r * .68, Math.sin(a) * r * .68, r * .23, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#ffd47a'; ctx.beginPath(); ctx.arc(0, 0, r * .72, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4b2a0d'; ctx.beginPath(); ctx.arc(-r * .25, -r * .12, r * .07, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(r * .25, -r * .12, r * .07, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.strokeStyle = '#4b2a0d'; ctx.beginPath(); ctx.arc(0, r * .1, r * .28, 0, Math.PI); ctx.stroke();
    ctx.restore();
  }

  function drawLion(x, y, r) {
    ctx.save();
    ctx.translate(x, y);
    const pulse = Math.sin(performance.now() * .008) * .5 + .5;
    const glow = ctx.createRadialGradient(0, 0, r * .18, 0, 0, r * 1.9 + pulse * 3);
    glow.addColorStop(0, 'rgba(255,225,145,.62)');
    glow.addColorStop(.6, 'rgba(255,178,80,.18)');
    glow.addColorStop(1, 'rgba(255,178,80,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, 0, r * 1.95 + pulse * 3, 0, Math.PI * 2); ctx.fill();
    if (!drawSvgImage(uiImages.lionFace, 0, 0, r * 2.35, r * 2.35, Math.sin(performance.now() * .003) * .02, 1)) {
      drawLionFallback(0, 0, r);
    }
    ctx.restore();
  }

  function drawSixColorIcon(x, y) {
    ctx.save(); ctx.translate(x, y);
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI * 2 / 6;
      ctx.fillStyle = COLORS[i].fill;
      ctx.beginPath(); ctx.arc(Math.cos(a) * 25, Math.sin(a) * 25, 15, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#fff'; ctx.font = '900 23px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('6', 0, 1);
    ctx.restore();
  }

  function drawCrashIcon(x, y) {
    ctx.save();
    ctx.translate(x, y);
    drawSunnyBadge(0, 0, 34, { damage: true, feverMode: false });
    ctx.rotate(Math.sin(performance.now() * .02) * .05);
    ctx.fillStyle = '#ff5a62';
    ctx.font = '900 34px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(70,0,10,.75)';
    ctx.strokeText('!', 0, 2); ctx.fillText('!', 0, 2);
    ctx.restore();
  }

  function tileColorByType(type) { return type === 'lion' ? '#ffe17a' : COLORS[type % COLORS.length].fill; }
  function tileColor(t) { return isLionTile(t) ? '#ffe17a' : tileColorByType(t.type); }

  function hexToRgba(hex, alpha) {
    if (!hex || hex[0] !== '#') return hex;
    const v = hex.slice(1);
    const n = parseInt(v.length === 3 ? v.split('').map(x => x + x).join('') : v, 16);
    const r = (n >> 16) & 255; const g = (n >> 8) & 255; const b = n & 255;
    return `rgba(${r},${g},${b},${alpha})`;
  }

  function gameLoop(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(gameLoop);
  }

  canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
  canvas.addEventListener('pointermove', onPointerMove, { passive: false });
  canvas.addEventListener('pointerup', onPointerUp, { passive: false });
  canvas.addEventListener('pointercancel', onPointerUp, { passive: false });
  window.addEventListener('blur', () => { paused = true; });
  window.addEventListener('focus', () => { paused = false; lastTime = performance.now(); });
  document.addEventListener('gesturestart', e => e.preventDefault());

  setupFirebaseRanking();
  initBoard();
  for (let i = 0; i < 4; i++) spawnMeteor(1);
  requestAnimationFrame(gameLoop);
})();
</script>
</body>
